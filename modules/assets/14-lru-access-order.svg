<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 448" width="780" height="448" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">LRU：哈希定位节点，链表维护访问顺序</title><desc id="diagram-desc">get B先用哈希表定位B，再把B从A-B-C链表摘下移到尾部，得到A-C-B。表里保存节点引用，移动不需扫描链表。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="448" fill="#ffffff"/>

<path data-connector="true" d="M 253,118.0 L 267,118.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,132.0 L 259,132.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,118.0 L 521,118.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,132.0 L 513,132.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 253,298.0 L 267,298.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,312.0 L 259,312.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,298.0 L 521,298.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,312.0 L 513,312.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">LRU：哈希定位节点，链表维护访问顺序</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">约定：左侧最久未使用，右侧最近使用；容量为 3</text><text x="390" y="80" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">访问前：HashMap 持有 key → 节点；get(B) 平均 O(1) 定位</text><!-- preA: x=24, y=98, w=224, h=54, right=248, bottom=152 --><rect data-node="preA" x="24" y="98" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="preA">A</text><text x="136.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="preA">最久未使用</text><!-- preB: x=278, y=98, w=224, h=54, right=502, bottom=152 --><rect data-node="preB" x="278" y="98" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="preB">B</text><text x="390.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="preB">待访问</text><!-- preC: x=532, y=98, w=224, h=54, right=756, bottom=152 --><rect data-node="preC" x="532" y="98" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="644.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="preC">C</text><text x="644.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="preC">最近使用</text><!-- get: x=278, y=180, w=224, h=54, right=502, bottom=234 --><rect data-node="get" x="278" y="180" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="get">get(B)：摘下 B</text><text x="390.0" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="get">将同一节点放到尾部</text><text x="390" y="260" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">访问后：A 仍最旧；新插入 D 时应淘汰 A</text><!-- postA: x=24, y=278, w=224, h=54, right=248, bottom=332 --><rect data-node="postA" x="24" y="278" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="300.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="postA">A</text><text x="136.0" y="318.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="postA">最久未使用</text><!-- postC: x=278, y=278, w=224, h=54, right=502, bottom=332 --><rect data-node="postC" x="278" y="278" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="300.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="postC">C</text><text x="390.0" y="318.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="postC">次新</text><!-- postB: x=532, y=278, w=224, h=54, right=756, bottom=332 --><rect data-node="postB" x="532" y="278" width="224" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="300.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="postB">B</text><text x="644.0" y="318.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="postB">最近使用</text><text x="390" y="373" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">图中双向箭头是 prev / next 引用；中间说明框表示操作，不表示链表节点。</text><text x="390.0" y="423" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">教学图不含并发、TTL、权重与哨兵节点；LinkedHashMap 参考实现按条目数淘汰。</text>
</svg>