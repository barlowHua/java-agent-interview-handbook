<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">数据库演进：扩展、迁移、切换、收缩</title><desc id="diagram-desc">六步兼容迁移，直到验证旧版本不再使用后才收缩旧字段。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="350" fill="#ffffff"/>

<path data-connector="true" d="M 253,116.0 L 267,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,116.0 L 521,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 644.0,157 L 644.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,216.0 L 513,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,216.0 L 259,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">数据库演进：扩展、迁移、切换、收缩</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">回滚代码之前，先确认新旧数据格式仍然兼容</text><!-- expand: x=24, y=80, w=224, h=72, right=248, bottom=152 --><rect data-node="expand" x="24" y="80" width="224" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="expand">1 扩展</text><text x="136.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="expand">新增字段 / 保留旧字段</text><!-- coexist: x=278, y=80, w=224, h=72, right=502, bottom=152 --><rect data-node="coexist" x="278" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="coexist">2 兼容运行</text><text x="390.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="coexist">新旧实例均可读写</text><!-- backfill: x=532, y=80, w=224, h=72, right=756, bottom=152 --><rect data-node="backfill" x="532" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="644.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="backfill">3 回填与核对</text><text x="644.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="backfill">历史补齐 / 增量追平</text><!-- switch: x=532, y=180, w=224, h=72, right=756, bottom=252 --><rect data-node="switch" x="532" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="switch">4 切换读路径</text><text x="644.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="switch">灰度 / 业务指标验证</text><!-- observe: x=278, y=180, w=224, h=72, right=502, bottom=252 --><rect data-node="observe" x="278" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="observe">5 观察并停旧写</text><text x="390.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="observe">确认消费者与旧版退场</text><!-- contract: x=24, y=180, w=224, h=72, right=248, bottom=252 --><rect data-node="contract" x="24" y="180" width="224" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="136.0" y="211.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="contract">6 收缩</text><text x="136.0" y="229.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="contract">删除旧路径 / 旧字段</text><text x="390" y="291" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400">不可逆边界：收缩与数据变换后，旧镜像可能已无法正确工作。</text><text x="390.0" y="325" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">示意不规定双写实现；一致性、回填校验、迁移失败恢复必须单独设计。</text>
</svg>