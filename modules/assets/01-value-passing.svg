<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 309" width="780" height="309" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">值传递：复制的是引用值，对象可以继续共享</title><desc id="diagram-desc">左侧修改共享对象内容，调用方可以观察到；右侧只让形参指向新对象，调用方引用仍指向原对象。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="309" fill="#ffffff"/>
<rect data-group="mutation" x="25" y="65" width="352" height="194" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="79" font-size="11" text-anchor="start" fill="#64748b">① 修改对象：p.status = PAID</text><rect data-group="rebind" x="403" y="65" width="352" height="194" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="413" y="79" font-size="11" text-anchor="start" fill="#64748b">② 重绑形参：p = new Order()</text>
<path data-connector="true" d="M 116.5,159 C 116.5,170 135,158 135,169" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 285.5,159 C 285.5,170 267,158 267,169" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 494.5,159 L 494.5,169" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 663.5,159 L 663.5,169" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">值传递：复制的是引用值，对象可以继续共享</text><!-- caller-a: x=45, y=100, w=143, h=54, right=188, bottom=154 --><rect data-node="caller-a" x="45" y="100" width="143" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="116.5" y="122.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller-a">调用方 order</text><text x="116.5" y="140.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller-a">引用 A</text><!-- param-a: x=214, y=100, w=143, h=54, right=357, bottom=154 --><rect data-node="param-a" x="214" y="100" width="143" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="285.5" y="122.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="param-a">形参 p</text><text x="285.5" y="140.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="param-a">引用 A</text><!-- caller-b: x=423, y=100, w=143, h=54, right=566, bottom=154 --><rect data-node="caller-b" x="423" y="100" width="143" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="494.5" y="122.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller-b">调用方 order</text><text x="494.5" y="140.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller-b">引用 A</text><!-- param-b: x=592, y=100, w=143, h=54, right=735, bottom=154 --><rect data-node="param-b" x="592" y="100" width="143" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="663.5" y="122.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="param-b">形参 p</text><text x="663.5" y="140.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="param-b">引用 B</text><!-- shared: x=45, y=180, w=312, h=54, right=357, bottom=234 --><rect data-node="shared" x="45" y="180" width="312" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="201.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="shared">对象 A：status = PAID</text><text x="201.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="shared">两个独立变量指向同一对象</text><!-- original: x=423, y=180, w=143, h=54, right=566, bottom=234 --><rect data-node="original" x="423" y="180" width="143" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="494.5" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="original">对象 A</text><text x="494.5" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="original">仍由 order 引用</text><!-- new: x=592, y=180, w=143, h=54, right=735, bottom=234 --><rect data-node="new" x="592" y="180" width="143" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="663.5" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="new">新对象 B</text><text x="663.5" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="new">由 p 引用</text><text x="390.0" y="284" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">箭头表示对象引用；方法调用先复制引用值，图中展示两种操作完成后的状态。</text>
</svg>