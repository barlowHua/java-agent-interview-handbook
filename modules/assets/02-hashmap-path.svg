<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">HashMap：先定位桶，再判相等；扩容只看新增容量位</title><desc id="diagram-desc">上方是查找主线，下方是容量翻倍时的桶拆分。适用于常见 OpenJDK 17/21 实现。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="312" fill="#ffffff"/>

<path data-connector="true" d="M 256,107.0 L 266,107.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 508,107.0 L 518,107.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 256,214.0 L 266,214.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 508,214.0 L 518,214.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">HashMap：先定位桶，再判相等；扩容只看新增容量位</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">实现基线：OpenJDK 17/21；容量 n 为二次幂，h 为扰动后的哈希</text><!-- key: x=25, y=80, w=226, h=54, right=251, bottom=134 --><rect data-node="key" x="25" y="80" width="226" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="102.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="key">① 输入 key</text><text x="138.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="key">计算扰动哈希 h</text><!-- index: x=277, y=80, w=226, h=54, right=503, bottom=134 --><rect data-node="index" x="277" y="80" width="226" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="index">② 桶索引</text><text x="390.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="index">index = (n - 1) &amp; h</text><!-- lookup: x=529, y=80, w=226, h=54, right=755, bottom=134 --><rect data-node="lookup" x="529" y="80" width="226" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="102.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="lookup">③ 桶内查找</text><text x="642.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="lookup">比较 hash 与身份 / equals</text><text x="390" y="161" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">命中：get 取值 / put 替换；未命中：get 返回 null / put 新增。</text><!-- old: x=25, y=187, w=226, h=54, right=251, bottom=241 --><rect data-node="old" x="25" y="187" width="226" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="209.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="old">扩容：oldCap → 2 × oldCap</text><text x="138.0" y="227.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="old">旧桶 i 中的各个条目</text><!-- bit: x=277, y=187, w=226, h=54, right=503, bottom=241 --><rect data-node="bit" x="277" y="187" width="226" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="209.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="bit">检查新增的容量位</text><text x="390.0" y="227.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="bit">h &amp; oldCap</text><!-- new: x=529, y=187, w=226, h=54, right=755, bottom=241 --><rect data-node="new" x="529" y="187" width="226" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="new">该位为 0：仍在桶 i</text><text x="642.0" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="new">该位为 1：到 i + oldCap</text><text x="390.0" y="271" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">例：oldCap = 16，h = 3 与 h = 19 原来都在桶 3；翻倍后分别在桶 3 和桶 19。</text><text x="390.0" y="287" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">树化和退化取决于容量及具体分支；此图不表示 HashMap 可以安全并发写。</text>
</svg>