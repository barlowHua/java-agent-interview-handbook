<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" width="780" height="485" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Agent 信任边界：外部文本不能直接获得执行权</title><desc id="diagram-desc">外部资料经过模型变成候选动作，动作必须跨过可信执行门禁。凭据仅在可信层使用，业务服务限制对象、幂等与出站目标。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="485" fill="#ffffff"/>
<rect data-group="untrusted" x="25" y="80" width="350" height="322" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="94" font-size="11" text-anchor="start" fill="#64748b">非授权来源：只产生数据或动作提议</text><rect data-group="trusted" x="405" y="80" width="350" height="322" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="415" y="94" font-size="11" text-anchor="start" fill="#64748b">可信执行层：授权、凭据和业务规则</text>
<path data-connector="true" data-from="data" data-to="model" d="M 200.0,187 L 200.0,199" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" data-from="model" data-to="proposal" d="M 200.0,287 L 200.0,299" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" data-from="identity" data-to="gate" d="M 580.0,187 L 580.0,199" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" data-from="gate" data-to="service" d="M 580.0,287 L 580.0,299" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="proposal" data-to="gate" d="M 365,346 C 390,346 384,246 409,246" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Agent 信任边界：外部文本不能直接获得执行权</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">来源标签和提示词是辅助；真正限制副作用的是服务端身份、政策与隔离</text><!-- data: x=40, y=110, w=320, h=72, right=360, bottom=182 --><rect data-node="data" x="40" y="110" width="320" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="200.0" y="132.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="data">网页 / 文档 / 邮件 / 工具文本</text><text x="200.0" y="150.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="data">可能包含“忽略规则、导出密钥”等指令</text><text x="200.0" y="168.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="data">不能把检索内容当作用户授权</text><!-- model: x=40, y=210, w=320, h=72, right=360, bottom=282 --><rect data-node="model" x="40" y="210" width="320" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="200.0" y="232.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">模型理解与生成</text><text x="200.0" y="250.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">可以被不可信内容误导</text><text x="200.0" y="268.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">不持有支付凭据，不拥有最终批准权</text><!-- proposal: x=40, y=310, w=320, h=72, right=360, bottom=382 --><rect data-node="proposal" x="40" y="310" width="320" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="200.0" y="332.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proposal">候选动作：工具名 + 参数</text><text x="200.0" y="350.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proposal">读取与写入能力分开</text><text x="200.0" y="368.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proposal">身份与 tenantId 不由模型声明</text><!-- identity: x=420, y=110, w=320, h=72, right=740, bottom=182 --><rect data-node="identity" x="420" y="110" width="320" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="580.0" y="132.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="identity">认证后的身份与授权上下文</text><text x="580.0" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="identity">对象范围、操作类型、有效期</text><text x="580.0" y="168.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="identity">短期凭据留在服务端使用</text><!-- gate: x=420, y=210, w=320, h=72, right=740, bottom=282 --><rect data-node="gate" x="420" y="210" width="320" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="580.0" y="232.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">执行门禁：校验具体对象与参数</text><text x="580.0" y="250.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">允许的工具、业务条件、预算与审批</text><text x="580.0" y="268.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">拒绝 / 等待补充 / 放行</text><!-- service: x=420, y=310, w=320, h=72, right=740, bottom=382 --><rect data-node="service" x="420" y="310" width="320" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="580.0" y="332.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="service">业务服务与出站控制</text><text x="580.0" y="350.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="service">幂等、交易约束、流水查询、目标白名单</text><text x="580.0" y="368.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="service">返回最小必要结果并脱敏</text><text x="390.0" y="428" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">左侧内容不能绕过门禁访问右侧业务服务；凭据不能通过模型上下文转发给任意目标。</text><text x="390.0" y="444" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">只读也会泄露数据，工具结果仍作为数据回到循环；来源可信不等于其文字可以提升权限。</text><text x="390.0" y="460" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">这些控制用于降低风险，并不承诺消除所有 prompt injection 或运行环境漏洞。</text>
</svg>