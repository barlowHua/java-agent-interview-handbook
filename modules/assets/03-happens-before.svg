<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 309" width="780" height="309" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">happens-before：用一条同步边发布普通数据</title><desc id="diagram-desc">线程 A 先写普通字段 data=42，再写 volatile ready=true；线程 B 读到该 true 后读取 data，程序顺序与 volatile 同步边传递保证读取结果。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="309" fill="#ffffff"/>
<rect data-group="writer" x="25" y="75" width="352" height="184" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="89" font-size="11" text-anchor="start" fill="#64748b">写线程 A：发布数据</text><rect data-group="reader" x="403" y="75" width="352" height="184" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="413" y="89" font-size="11" text-anchor="start" fill="#64748b">读线程 B：消费已发布数据</text>
<path data-connector="true" d="M 201.0,169 L 201.0,179" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 579.0,169 L 579.0,179" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 362,217 C 388,217 386,137 412,137" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">happens-before：用一条同步边发布普通数据</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">初始 data = 0、ready = false；只有 A 写入一次；ready 声明为 volatile</text><!-- data-write: x=45, y=110, w=312, h=54, right=357, bottom=164 --><rect data-node="data-write" x="45" y="110" width="312" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="201.0" y="132.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="data-write">① 普通字段写入</text><text x="201.0" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="data-write">data = 42</text><!-- flag-write: x=45, y=190, w=312, h=54, right=357, bottom=244 --><rect data-node="flag-write" x="45" y="190" width="312" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="201.0" y="212.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="flag-write">② volatile 写</text><text x="201.0" y="230.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="flag-write">ready = true</text><!-- flag-read: x=423, y=110, w=312, h=54, right=735, bottom=164 --><rect data-node="flag-read" x="423" y="110" width="312" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="579.0" y="132.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="flag-read">③ volatile 读</text><text x="579.0" y="150.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="flag-read">确认读到 ready == true</text><!-- data-read: x=423, y=190, w=312, h=54, right=735, bottom=244 --><rect data-node="data-read" x="423" y="190" width="312" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="579.0" y="212.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="data-read">④ 后续读取 data</text><text x="579.0" y="230.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="data-read">在本例条件下必须得到 42</text><text x="390.0" y="284" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">蓝色：同线程程序顺序；紫色：同一 volatile 的同步边；两类边可传递。</text>
</svg>