<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Kafka KRaft：控制器仲裁与分区 ISR 是不同的复制集合</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="440" fill="#ffffff"/>
<rect data-group="control" x="25" y="78" width="730" height="136" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="92" font-size="11" text-anchor="start" fill="#64748b">控制面：controller quorum，复制集群元数据日志</text><rect data-group="data" x="25" y="239" width="730" height="136" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="253" font-size="11" text-anchor="start" fill="#64748b">数据面：示例业务分区 P0，按该分区 leader / ISR 协议复制</text>
<path data-connector="true" d="M 260,144.0 L 269,144.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 150,185 C 150,212 625,212 625,191" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 260,305.0 L 269,305.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 150,346 C 150,373 625,373 625,352" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 390,219 L 390,228" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Kafka KRaft：控制器仲裁与分区 ISR 是不同的复制集合</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">实线表示该层日志复制；层间虚线表示分区等元数据影响 broker 的运行状态</text><!-- active: x=45, y=108, w=210, h=72, right=255, bottom=180 --><rect data-node="active" x="45" y="108" width="210" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="150.0" y="130.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="active">活动 controller</text><text x="150.0" y="148.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="active">协调分区与选主</text><text x="150.0" y="166.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="active">元数据日志 leader</text><!-- controller2: x=280, y=108, w=210, h=72, right=490, bottom=180 --><rect data-node="controller2" x="280" y="108" width="210" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="385.0" y="130.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller2">controller 2</text><text x="385.0" y="148.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller2">复制元数据日志</text><text x="385.0" y="166.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller2">参与控制器仲裁</text><!-- controller3: x=515, y=108, w=220, h=72, right=735, bottom=180 --><rect data-node="controller3" x="515" y="108" width="220" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="625.0" y="130.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller3">controller 3</text><text x="625.0" y="148.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller3">复制元数据日志</text><text x="625.0" y="166.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="controller3">参与控制器仲裁</text><!-- broker1: x=45, y=269, w=210, h=72, right=255, bottom=341 --><rect data-node="broker1" x="45" y="269" width="210" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="150.0" y="291.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="broker1">broker 1：P0 leader</text><text x="150.0" y="309.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="broker1">保存业务消息</text><text x="150.0" y="327.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="broker1">接受该分区生产与读取</text><!-- broker2: x=280, y=269, w=210, h=72, right=490, bottom=341 --><rect data-node="broker2" x="280" y="269" width="210" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="385.0" y="291.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker2">broker 2：P0 follower</text><text x="385.0" y="309.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker2">假设当前处于 ISR</text><text x="385.0" y="327.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker2">复制业务分区日志</text><!-- broker3: x=515, y=269, w=220, h=72, right=735, bottom=341 --><rect data-node="broker3" x="515" y="269" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="625.0" y="291.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker3">broker 3：P0 follower</text><text x="625.0" y="309.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker3">假设当前处于 ISR</text><text x="625.0" y="327.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="broker3">复制业务分区日志</text><text x="390.0" y="399" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">控制器的多数派不等于 P0 的 ISR；上层健康也不能证明某个业务分区的数据可用或已提交。</text><text x="390.0" y="415" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">按 Kafka 4.1 角色语义示意：角色可配置分离或组合；省略元数据拉取、成员变化及其他分区。</text>
</svg>