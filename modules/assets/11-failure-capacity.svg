<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 386" width="780" height="386" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">容量设计：先满足丢失一个故障域后的安全吞吐</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="386" fill="#ffffff"/>

<path data-connector="true" d="M 390.0,137 C 390.0,172 137.5,111 137.5,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,137 L 390.0,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,137 C 390.0,172 642.5,111 642.5,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">容量设计：先满足丢失一个故障域后的安全吞吐</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">假设：峰值 1000 QPS，压测确定单实例满足目标延迟的安全容量为 300 QPS</text><!-- load: x=277.5, y=78, w=225, h=54, right=502.5, bottom=132 --><rect data-node="load" x="277.5" y="78" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="load">全局入口：1000 QPS</text><text x="390.0" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="load">限流与路由避免局部过载</text><!-- aza: x=25, y=157, w=225, h=72, right=250, bottom=229 --><rect data-node="aza" x="25" y="157" width="225" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="137.5" y="179.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="aza">可用区 A</text><text x="137.5" y="197.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="aza">2 实例 × 300 = 600 QPS</text><text x="137.5" y="215.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="aza">应用故障域彼此独立</text><!-- azb: x=277.5, y=157, w=225, h=72, right=502.5, bottom=229 --><rect data-node="azb" x="277.5" y="157" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="179.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azb">可用区 B</text><text x="390.0" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azb">2 实例 × 300 = 600 QPS</text><text x="390.0" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azb">应用故障域彼此独立</text><!-- azc: x=530, y=157, w=225, h=72, right=755, bottom=229 --><rect data-node="azc" x="530" y="157" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="179.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azc">可用区 C</text><text x="642.5" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azc">2 实例 × 300 = 600 QPS</text><text x="642.5" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="azc">应用故障域彼此独立</text><!-- proof: x=25, y=254, w=730, h=72, right=755, bottom=326 --><rect data-node="proof" x="25" y="254" width="730" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="276.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proof">A 区故障后：B + C = 4 × 300 = 1200 QPS ≥ 1000 QPS，余量 200 QPS。</text><text x="390.0" y="294.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proof">这只是应用层算术：数据库、MQ、身份服务、网络和配额也必须承受切换流量。</text><text x="390.0" y="312.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proof">若平均耗时 200ms，稳定态平均在途约 200；不能把 P99 直接代入得到线程池大小。</text><text x="390.0" y="345" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">原始容量 1800 QPS 不等于可承诺容量；验证切流、冷缓存、偏斜和故障恢复时的实际延迟。</text><text x="390.0" y="361" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">数字仅用于方法演示；真实设计按观测流量、压测容量与目标冗余重新计算。</text>
</svg>