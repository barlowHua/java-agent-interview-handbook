<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" width="780" height="418" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Cache-aside 反例：删除成功后仍可回填旧值</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="418" fill="#ffffff"/>

<path data-connector="true" d="M 137.5,137 L 137.5,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 137.5,216 L 137.5,225" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 642.5,137 L 642.5,146" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 525,184.0 L 513.5,184.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 255,263.0 L 266.5,263.0" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 507.5,263.0 L 519,263.0" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Cache-aside 反例：删除成功后仍可回填旧值</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">按 ①→⑤ 阅读；左侧读请求 A，右侧写请求 B，中间是共享数据的变化</text><!-- a1: x=25, y=78, w=225, h=54, right=250, bottom=132 --><rect data-node="a1" x="25" y="78" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a1">① A：缓存未命中</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a1">② 读 DB 得 v1，随后暂停</text><!-- state1: x=277.5, y=78, w=225, h=54, right=502.5, bottom=132 --><rect data-node="state1" x="277.5" y="78" width="225" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="state1">起点</text><text x="390.0" y="118.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="state1">DB=v1，cache 不存在</text><!-- b1: x=530, y=78, w=225, h=54, right=755, bottom=132 --><rect data-node="b1" x="530" y="78" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b1">B 准备写入 v2</text><text x="642.5" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b1">A 已持有旧结果 v1</text><!-- a2: x=25, y=157, w=225, h=54, right=250, bottom=211 --><rect data-node="a2" x="25" y="157" width="225" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="137.5" y="179.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="a2">A 仍在暂停</text><text x="137.5" y="197.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="a2">尚未执行缓存 SET</text><!-- state2: x=277.5, y=157, w=225, h=54, right=502.5, bottom=211 --><rect data-node="state2" x="277.5" y="157" width="225" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="179.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="state2">③ DB=v2 提交完成</text><text x="390.0" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="state2">④ cache 删除成功</text><!-- b2: x=530, y=157, w=225, h=54, right=755, bottom=211 --><rect data-node="b2" x="530" y="157" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="179.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b2">B：先提交数据库</text><text x="642.5" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b2">再删除缓存，已完成</text><!-- a3: x=25, y=236, w=225, h=54, right=250, bottom=290 --><rect data-node="a3" x="25" y="236" width="225" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="137.5" y="258.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="a3">⑤ A 恢复</text><text x="137.5" y="276.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="a3">SET cache=v1，并设置 TTL</text><!-- state3: x=277.5, y=236, w=225, h=54, right=502.5, bottom=290 --><rect data-node="state3" x="277.5" y="236" width="225" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="258.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="state3">结果：DB=v2，cache=v1</text><text x="390.0" y="276.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="state3">TTL 从旧值回填时开始</text><!-- b3: x=530, y=236, w=225, h=54, right=755, bottom=290 --><rect data-node="b3" x="530" y="236" width="225" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.5" y="258.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="b3">后续读取可能命中 v1</text><text x="642.5" y="276.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="b3">成功删除不等于原子一致</text><!-- guard: x=25, y=315, w=730, h=54, right=755, bottom=369 --><rect data-node="guard" x="25" y="315" width="730" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="337.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="guard">关键决策查权威源；展示缓存定义陈旧窗口，配合可靠失效与回填版本栅栏。</text><text x="390.0" y="355.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="guard">固定延迟双删与 TTL 都不能覆盖任意长暂停、持续旧回填或副本滞后。</text><text x="390.0" y="393" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">思考：若 A 在 B 提交后暂停了 20 秒，TTL=5 秒，能承诺从 B 提交起最多旧 5 秒吗？</text>
</svg>