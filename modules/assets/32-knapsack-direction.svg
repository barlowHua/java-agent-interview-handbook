<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" width="780" height="362" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">0/1 背包：倒序保留上一轮状态</title><desc id="diagram-desc">单件重量2价值3容量4，正序会复用当前件得到6，倒序结果为3。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="362" fill="#ffffff"/>

<path data-connector="true" d="M 255,134.0 L 269,134.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 505,134.0 L 519,134.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 255,250.0 L 269,250.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 505,250.0 L 519,250.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">0/1 背包：倒序保留上一轮状态</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">只有一件物品：重量 2，价值 3；容量 4；dp 初始全为 0</text><!-- r4: x=30, y=98, w=220, h=72, right=250, bottom=170 --><rect data-node="r4" x="30" y="98" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="140.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r4">倒序：先更新 c=4</text><text x="140.0" y="138.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r4">读取旧 dp[2]=0</text><text x="140.0" y="156.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r4">dp[4] = 3</text><!-- r3: x=280, y=98, w=220, h=72, right=500, bottom=170 --><rect data-node="r3" x="280" y="98" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r3">再更新 c=3</text><text x="390.0" y="138.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r3">读取旧 dp[1]=0</text><text x="390.0" y="156.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r3">dp[3] = 3</text><!-- r2: x=530, y=98, w=220, h=72, right=750, bottom=170 --><rect data-node="r2" x="530" y="98" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="640.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r2">最后更新 c=2</text><text x="640.0" y="138.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r2">读取 dp[0]=0</text><text x="640.0" y="156.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="r2">dp[2] = 3</text><!-- f2: x=30, y=214, w=220, h=72, right=250, bottom=286 --><rect data-node="f2" x="30" y="214" width="220" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="140.0" y="236.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="f2">正序：先更新 c=2</text><text x="140.0" y="254.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="f2">dp[2] = 3</text><text x="140.0" y="272.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="f2">本轮已使用当前物品</text><!-- f4: x=280, y=214, w=220, h=72, right=500, bottom=286 --><rect data-node="f4" x="280" y="214" width="220" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="236.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="f4">随后更新 c=4</text><text x="390.0" y="254.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="f4">读到新的 dp[2]=3</text><text x="390.0" y="272.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="f4">dp[4] = 3 + 3 = 6</text><!-- bad: x=530, y=214, w=220, h=72, right=750, bottom=286 --><rect data-node="bad" x="530" y="214" width="220" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="640.0" y="236.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="bad">结果违反 0/1 条件</text><text x="640.0" y="254.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="bad">同一物品被使用两次</text><text x="640.0" y="272.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="bad">语义变成可重复使用</text><text x="390.0" y="337" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">先定义“最多容量”还是“恰好装满”；倒序条件不能替代正确的状态初始化。</text>
</svg>