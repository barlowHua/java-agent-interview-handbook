<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">MVCC：沿 undo 版本链寻找本次读视图可见的版本</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="330" fill="#ffffff"/>

<path data-connector="true" d="M 255,114.0 L 266.5,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,114.0 L 519,114.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 642.5,155 L 642.5,164" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 525,220.0 L 513.5,220.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">MVCC：沿 undo 版本链寻找本次读视图可见的版本</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">教学快照：创建者=100，活跃集合={98,103}，最小活跃=98，下一事务边界=105</text><!-- view: x=25, y=78, w=225, h=72, right=250, bottom=150 --><rect data-node="view" x="25" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="view">Read View 固定判定规则</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="view">自身修改可见</text><text x="137.5" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="view">其他版本看创建时状态</text><!-- latest: x=277.5, y=78, w=225, h=72, right=502.5, bottom=150 --><rect data-node="latest" x="277.5" y="78" width="225" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="latest">当前行：trx_id=105</text><text x="390.0" y="118.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="latest">值 v3；快照之后产生</text><text x="390.0" y="136.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="latest">不可见 → 找前一版</text><!-- later: x=530, y=78, w=225, h=72, right=755, bottom=150 --><rect data-node="later" x="530" y="78" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="later">undo 重建：trx_id=103</text><text x="642.5" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="later">值 v2；创建快照时活跃</text><text x="642.5" y="136.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="later">不可见 → 找前一版</text><!-- rule: x=25, y=175, w=225, h=90, right=250, bottom=265 --><rect data-node="rule" x="25" y="175" width="225" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="137.5" y="197.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="rule">RC：每次一致性读新视图</text><text x="137.5" y="215.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="rule">RR：通常复用首次视图</text><text x="137.5" y="233.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="rule">SELECT FOR UPDATE</text><text x="137.5" y="251.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="rule">不按这个快照规则读取</text><!-- result: x=277.5, y=175, w=225, h=90, right=502.5, bottom=265 --><rect data-node="result" x="277.5" y="175" width="225" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="197.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">本次读返回 v1</text><text x="390.0" y="215.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">不是简单取最大 trx_id</text><text x="390.0" y="233.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">也不是取读取瞬间</text><text x="390.0" y="251.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">最新已提交值</text><!-- old: x=530, y=175, w=225, h=90, right=755, bottom=265 --><rect data-node="old" x="530" y="175" width="225" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="old">undo 重建：trx_id=97</text><text x="642.5" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="old">值 v1；早于活跃下界</text><text x="642.5" y="233.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="old">已提交，可见</text><text x="642.5" y="251.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="old">停止沿链查找</text><text x="390.0" y="289" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">103 之后即便已经提交，仍不改变旧 Read View 对它的判断；新 RC 视图可能看到新版本。</text><text x="390.0" y="305" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">图只展示普通一致性读与存活行；删除标记、不可见插入和二级索引路径另行处理。</text>
</svg>