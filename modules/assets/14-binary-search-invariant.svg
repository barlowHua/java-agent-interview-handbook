<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 342" width="660" height="342" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">二分边界：把未知区间持续缩小</title><desc id="diagram-desc">数组1、3、3、6、9中查找第一个大于等于3的位置。首次mid=2，hi收缩为2，再用不变量推到答案1。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="660" height="342" fill="#ffffff"/>


<text x="330.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">二分边界：把未知区间持续缩小</text><text x="330.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">lowerBound · [lo, hi) · target = 3 · 重复值不能随便返回</text><text x="330" y="80" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">初态：lo=0，hi=5，mid=2；未知区间为 [0,5)</text><!-- before0: x=24, y=98, w=100, h=54, right=124, bottom=152 --><rect data-node="before0" x="24" y="98" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="74.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before0">a[0]</text><text x="74.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before0">1</text><!-- before1: x=152, y=98, w=100, h=54, right=252, bottom=152 --><rect data-node="before1" x="152" y="98" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="202.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before1">a[1]</text><text x="202.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before1">3</text><!-- before2: x=280, y=98, w=100, h=54, right=380, bottom=152 --><rect data-node="before2" x="280" y="98" width="100" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="330.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="before2">a[2]</text><text x="330.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="before2">3</text><!-- before3: x=408, y=98, w=100, h=54, right=508, bottom=152 --><rect data-node="before3" x="408" y="98" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="458.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before3">a[3]</text><text x="458.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before3">6</text><!-- before4: x=536, y=98, w=100, h=54, right=636, bottom=152 --><rect data-node="before4" x="536" y="98" width="100" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="586.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before4">a[4]</text><text x="586.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="before4">9</text><text x="330" y="178" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">a[2] ≥ 3，因此 hi=2；右侧 [2,5) 已知满足条件</text><!-- after0: x=24, y=196, w=100, h=54, right=124, bottom=250 --><rect data-node="after0" x="24" y="196" width="100" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="74.0" y="218.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="after0">1</text><text x="74.0" y="236.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="after0">待查 [0,2)</text><!-- after1: x=152, y=196, w=100, h=54, right=252, bottom=250 --><rect data-node="after1" x="152" y="196" width="100" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="202.0" y="218.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="after1">3</text><text x="202.0" y="236.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="after1">待查 [0,2)</text><!-- after2: x=280, y=196, w=100, h=54, right=380, bottom=250 --><rect data-node="after2" x="280" y="196" width="100" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="330.0" y="218.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after2">3</text><text x="330.0" y="236.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after2">已知 ≥ 3</text><!-- after3: x=408, y=196, w=100, h=54, right=508, bottom=250 --><rect data-node="after3" x="408" y="196" width="100" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="458.0" y="218.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after3">6</text><text x="458.0" y="236.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after3">已知 ≥ 3</text><!-- after4: x=536, y=196, w=100, h=54, right=636, bottom=250 --><rect data-node="after4" x="536" y="196" width="100" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="586.0" y="218.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after4">9</text><text x="586.0" y="236.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="after4">已知 ≥ 3</text><text x="330" y="282" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">不变量：i &lt; lo → a[i] &lt; target；i ≥ hi → a[i] ≥ target</text><text x="330.0" y="317" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">继续检查 mid=1、mid=0 后，lo=hi=1；找到的是第一个满足位置。</text>
</svg>