<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">一次请求：链路、等待与总时间预算</title><desc id="diagram-desc">请求依次经过客户端、入口、业务执行与下游；底部另用800ms预算展示串行耗时相加。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="410" fill="#ffffff"/>

<path data-connector="true" d="M 253,116.0 L 267,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,116.0 L 521,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 644.0,157 L 644.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,216.0 L 513,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,216.0 L 259,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">一次请求：链路、等待与总时间预算</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">先分清排队和执行，再沿同一个请求追踪证据</text><!-- client: x=24, y=80, w=224, h=72, right=248, bottom=152 --><rect data-node="client" x="24" y="80" width="224" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="client">1 客户端</text><text x="136.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="client">DNS / TCP / TLS</text><!-- entry: x=278, y=80, w=224, h=72, right=502, bottom=152 --><rect data-node="entry" x="278" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="entry">2 入口与队列</text><text x="390.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="entry">限流 / 排队 / deadline</text><!-- service: x=532, y=80, w=224, h=72, right=756, bottom=152 --><rect data-node="service" x="532" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="644.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="service">3 业务执行</text><text x="644.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="service">线程 / 锁 / 序列化</text><!-- pool: x=532, y=180, w=224, h=72, right=756, bottom=252 --><rect data-node="pool" x="532" y="180" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="644.0" y="211.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="pool">4 获取下游连接</text><text x="644.0" y="229.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="pool">连接池等待 / 连接超时</text><!-- remote: x=278, y=180, w=224, h=72, right=502, bottom=252 --><rect data-node="remote" x="278" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="remote">5 下游处理</text><text x="390.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="remote">SQL / RPC / 锁等待</text><!-- response: x=24, y=180, w=224, h=72, right=248, bottom=252 --><rect data-node="response" x="24" y="180" width="224" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="136.0" y="211.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="response">6 结果返回</text><text x="136.0" y="229.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="response">响应丢失 ≠ 未执行</text><text x="390" y="284" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">独立预算示例：100 + 300 + 300 + 100 = 800ms</text><!-- budget1: x=24, y=302, w=162, h=54, right=186, bottom=356 --><rect data-node="budget1" x="24" y="302" width="162" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="105.0" y="324.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="budget1">池等待</text><text x="105.0" y="342.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="budget1">100ms</text><!-- budget2: x=214, y=302, w=162, h=54, right=376, bottom=356 --><rect data-node="budget2" x="214" y="302" width="162" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="295.0" y="324.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="budget2">串行调用 A</text><text x="295.0" y="342.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="budget2">300ms</text><!-- budget3: x=404, y=302, w=162, h=54, right=566, bottom=356 --><rect data-node="budget3" x="404" y="302" width="162" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="485.0" y="324.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="budget3">串行调用 B</text><text x="485.0" y="342.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="budget3">300ms</text><!-- budget4: x=594, y=302, w=162, h=54, right=756, bottom=356 --><rect data-node="budget4" x="594" y="302" width="162" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="675.0" y="324.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="budget4">返回与安全余量</text><text x="675.0" y="342.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="budget4">100ms</text><text x="390.0" y="385" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">预算数字是教学假设；并行调用看关键路径，不能把各阶段 P99 直接相加。</text>
</svg>