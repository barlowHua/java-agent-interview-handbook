<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 409" width="780" height="409" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Elasticsearch：搜索可见与崩溃可恢复是两道边界</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="409" fill="#ffffff"/>

<path data-connector="true" d="M 380,114.0 L 394,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 200.0,155 L 200.0,164" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 580.0,155 L 580.0,164" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 380,308.0 L 394,308.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 580.0,252 L 580.0,261" fill="none" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Elasticsearch：搜索可见与崩溃可恢复是两道边界</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">以 8.19 单分片副本内部机制示意；完整写入还涉及主副本协议与确认条件</text><!-- index: x=25, y=78, w=350, h=72, right=375, bottom=150 --><rect data-node="index" x="25" y="78" width="350" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="200.0" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="index">写操作先更新内部 Lucene 索引</text><text x="200.0" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="index">数据进入索引缓冲等结构</text><text x="200.0" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="index">不意味着搜索立即可见</text><!-- translog: x=405, y=78, w=350, h=72, right=755, bottom=150 --><rect data-node="translog" x="405" y="78" width="350" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="580.0" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="translog">随后记录 translog</text><text x="580.0" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="translog">在对外确认前记录操作</text><text x="580.0" y="136.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="translog">不是每次都做完整 Lucene commit</text><!-- refresh: x=25, y=175, w=350, h=72, right=375, bottom=247 --><rect data-node="refresh" x="25" y="175" width="350" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="200.0" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="refresh">refresh：打开新 segment 的 reader</text><text x="200.0" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="refresh">新变更进入搜索视图</text><text x="200.0" y="233.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="refresh">可见 ≠ 已完成持久化 commit</text><!-- fsync: x=405, y=175, w=350, h=72, right=755, bottom=247 --><rect data-node="fsync" x="405" y="175" width="350" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="580.0" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fsync">translog durability=request</text><text x="580.0" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fsync">按相应确认规则 fsync/commit</text><text x="580.0" y="233.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fsync">async 策略有不同丢失窗口</text><!-- flush: x=25, y=272, w=350, h=72, right=375, bottom=344 --><rect data-node="flush" x="25" y="272" width="350" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="200.0" y="294.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="flush">后台 flush：Lucene commit</text><text x="200.0" y="312.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="flush">开始新 translog generation</text><text x="200.0" y="330.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="flush">限制恢复需要重放的范围</text><!-- recover: x=405, y=272, w=350, h=72, right=755, bottom=344 --><rect data-node="recover" x="405" y="272" width="350" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="580.0" y="294.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="recover">崩溃后恢复</text><text x="580.0" y="312.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="recover">最近有效 Lucene commit</text><text x="580.0" y="330.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="recover">再重放需要恢复的 translog</text><text x="390.0" y="368" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">左侧 refresh 与 flush 是不同后台动作，图未画成固定先后；refresh 不等于 fsync，merge 不等于 flush。</text><text x="390.0" y="384" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">段合并负责整理 segment / 回收删除空间；不应把提高 refresh 频率当作免费的实时一致性。</text>
</svg>