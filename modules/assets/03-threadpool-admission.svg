<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 517" width="780" height="517" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">ThreadPoolExecutor：一次 execute 的接纳路径</title><desc id="diagram-desc">主线依次尝试核心线程、入队、最大线程，最终拒绝；入队成功还需二次检查运行状态和 worker 数。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="517" fill="#ffffff"/>

<path data-connector="true" d="M 382,116.0 L 392,116.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 382,216.0 L 392,216.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 382,316.0 L 392,316.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 382,416.0 L 392,416.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 201.0,157 L 201.0,169" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 201.0,257 L 201.0,269" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 201.0,357 L 201.0,369" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">ThreadPoolExecutor：一次 execute 的接纳路径</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">左列由上向下；蓝色向右是本步成功路径，橙色向下是不适用或尝试未成功</text><!-- core: x=25, y=80, w=352, h=72, right=377, bottom=152 --><rect data-node="core" x="25" y="80" width="352" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="201.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="core">① workerCount &lt; corePoolSize？</text><text x="201.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="core">满足时尝试 addWorker(task, true)</text><text x="201.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="core">创建成功则走右侧；否则继续</text><!-- core-ok: x=403, y=80, w=352, h=72, right=755, bottom=152 --><rect data-node="core-ok" x="403" y="80" width="352" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="579.0" y="102.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="core-ok">新 worker 接收此任务</text><text x="579.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="core-ok">无需先进入队列</text><text x="579.0" y="138.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="core-ok">即便已有空闲线程也可能创建</text><!-- queue: x=25, y=180, w=352, h=72, right=377, bottom=252 --><rect data-node="queue" x="25" y="180" width="352" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="201.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="queue">② 池运行中且 offer(task) 成功？</text><text x="201.0" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="queue">满足时走右侧复查</text><text x="201.0" y="238.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="queue">不能入队则继续</text><!-- queued: x=403, y=180, w=352, h=72, right=755, bottom=252 --><rect data-node="queued" x="403" y="180" width="352" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="579.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="queued">入队成功仍要二次检查</text><text x="579.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="queued">停机且移除成功 → 拒绝</text><text x="579.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="queued">否则 worker 为 0 时尝试补 worker</text><!-- max: x=25, y=280, w=352, h=72, right=377, bottom=352 --><rect data-node="max" x="25" y="280" width="352" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="201.0" y="302.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="max">③ 尝试 addWorker(task, false)</text><text x="201.0" y="320.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="max">受 maximumPoolSize 与状态约束</text><text x="201.0" y="338.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="max">成功走右侧；不能创建则继续</text><!-- max-ok: x=403, y=280, w=352, h=72, right=755, bottom=352 --><rect data-node="max-ok" x="403" y="280" width="352" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="579.0" y="302.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="max-ok">新 worker 直接接收此任务</text><text x="579.0" y="320.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="max-ok">扩容发生在不能入队之后</text><text x="579.0" y="338.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="max-ok">并非先创建到 max 再排队</text><!-- reject: x=25, y=380, w=352, h=72, right=377, bottom=452 --><rect data-node="reject" x="25" y="380" width="352" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="201.0" y="402.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="reject">④ 无法接纳任务</text><text x="201.0" y="420.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="reject">执行 RejectedExecutionHandler</text><text x="201.0" y="438.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="reject">返回语义取决于拒绝策略</text><!-- result: x=403, y=380, w=352, h=72, right=755, bottom=452 --><rect data-node="result" x="403" y="380" width="352" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="579.0" y="402.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="result">抛错、调用者执行或其他策略</text><text x="579.0" y="420.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="result">静默丢弃可能遗留未完成 Future</text><text x="579.0" y="438.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="result">拒绝和排队时间必须可观测</text><text x="390.0" y="476" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">无界队列通常让任务持续排队，max 难以扩容；SynchronousQueue 没有常规存储容量。</text><text x="390.0" y="492" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">图概括 OpenJDK 21 execute 主线；线程工厂故障、状态竞态与关闭过程需结合源码。</text>
</svg>