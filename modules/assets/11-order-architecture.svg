<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 409" width="780" height="409" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">订单设计：同步受理与异步履约使用不同事务边界</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="409" fill="#ffffff"/>

<path data-connector="true" d="M 255,114.0 L 266.5,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,114.0 L 519,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.5,155 L 642.5,164" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 525,211.0 L 513.5,211.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 272.5,211.0 L 261,211.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 255,308.0 L 266.5,308.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,308.0 L 519,308.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.5,267 L 642.5,258" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">订单设计：同步受理与异步履约使用不同事务边界</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">教学架构；每个编号对应正文演例 A 的可恢复业务动作</text><!-- client: x=25, y=78, w=225, h=72, right=250, bottom=150 --><rect data-node="client" x="25" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="client">客户端：稳定请求号</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="client">① 创建订单 / 查询状态</text><text x="137.5" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="client">总 deadline 与重试次数有界</text><!-- api: x=277.5, y=78, w=225, h=72, right=502.5, bottom=150 --><rect data-node="api" x="277.5" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="api">订单 API</text><text x="390.0" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="api">鉴权、租户隔离、限流</text><text x="390.0" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="api">幂等冲突校验原始参数</text><!-- order: x=530, y=78, w=225, h=72, right=755, bottom=150 --><rect data-node="order" x="530" y="78" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="order">事务 A：订单 + Outbox</text><text x="642.5" y="118.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="order">唯一 (tenant, request_id)</text><text x="642.5" y="136.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="order">响应丢失 → 原身份查询</text><!-- fulfil: x=25, y=175, w=225, h=72, right=250, bottom=247 --><rect data-node="fulfil" x="25" y="175" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="137.5" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fulfil">履约数据库：事务 B</text><text x="137.5" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fulfil">消费去重 + 创建任务</text><text x="137.5" y="233.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fulfil">履约状态可独立查询</text><!-- worker: x=277.5, y=175, w=225, h=72, right=502.5, bottom=247 --><rect data-node="worker" x="277.5" y="175" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="worker">履约消费者</text><text x="390.0" y="215.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="worker">本地提交后确认</text><text x="390.0" y="233.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="worker">失败有界重试与隔离</text><!-- queue: x=530, y=175, w=225, h=72, right=755, bottom=247 --><rect data-node="queue" x="530" y="175" width="225" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.5" y="197.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="queue">② relay → MQ</text><text x="642.5" y="215.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="queue">事件 ID + 订单版本</text><text x="642.5" y="233.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="queue">监控最老事件年龄</text><!-- channel: x=25, y=272, w=225, h=72, right=250, bottom=344 --><rect data-node="channel" x="25" y="272" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="294.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="channel">支付渠道</text><text x="137.5" y="312.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="channel">原支付请求号查询</text><text x="137.5" y="330.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="channel">签名回调可能重复或晚到</text><!-- callback: x=277.5, y=272, w=225, h=72, right=502.5, bottom=344 --><rect data-node="callback" x="277.5" y="272" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="294.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="callback">③ 支付回调校验</text><text x="390.0" y="312.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="callback">验签、金额、币种、订单</text><text x="390.0" y="330.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="callback">超时未知不能直接判失败</text><!-- payment: x=530, y=272, w=225, h=72, right=755, bottom=344 --><rect data-node="payment" x="530" y="272" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="payment">事务 C：支付流水 + 订单</text><text x="642.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="payment">条件推进状态 + Outbox</text><text x="642.5" y="330.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="payment">渠道流水唯一；晚成功补偿</text><text x="390.0" y="368" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">横向看每次调用；纵向看事件传播。事务 A/C 可在同一订单库，但不与履约库组成一个本地事务。</text><text x="390.0" y="384" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">图省略支付发起箭头与副本拓扑；库存、渠道侧扣款和取消补偿仍须分别论证不变量。</text>
</svg>