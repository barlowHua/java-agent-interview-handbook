<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">服务端授权：身份、对象、动作三者相交</title><desc id="diagram-desc">不可信输入经认证变为可信身份，业务授权决定可操作对象范围，数据层收窄查询和输出。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="360" fill="#ffffff"/>

<path data-connector="true" d="M 253,116.0 L 267,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,116.0 L 521,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 644.0,157 L 644.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,216.0 L 513,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,216.0 L 259,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">服务端授权：身份、对象、动作三者相交</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">认证通过只是入口；对象级授权必须在业务边界落实</text><!-- client: x=24, y=80, w=224, h=72, right=248, bottom=152 --><rect data-node="client" x="24" y="80" width="224" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="136.0" y="111.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="client">不可信客户端</text><text x="136.0" y="129.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="client">订单 ID / 自报 tenantId</text><!-- authn: x=278, y=80, w=224, h=72, right=502, bottom=152 --><rect data-node="authn" x="278" y="80" width="224" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="authn">认证与凭据校验</text><text x="390.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="authn">签名 / 受众 / 有效期</text><!-- authz: x=532, y=80, w=224, h=72, right=756, bottom=152 --><rect data-node="authz" x="532" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="644.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="authz">业务授权</text><text x="644.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="authz">身份 × 对象 × 动作</text><!-- scope: x=532, y=180, w=224, h=72, right=756, bottom=252 --><rect data-node="scope" x="532" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="scope">权限限定的数据访问</text><text x="644.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="scope">租户过滤 / 字段白名单</text><!-- data: x=278, y=180, w=224, h=72, right=502, bottom=252 --><rect data-node="data" x="278" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="data">权威数据与缓存</text><text x="390.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="data">缓存键匹配权限作用域</text><!-- audit: x=24, y=180, w=224, h=72, right=248, bottom=252 --><rect data-node="audit" x="24" y="180" width="224" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="211.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="audit">响应与审计</text><text x="136.0" y="229.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="audit">最小字段 / 不泄漏密钥</text><text x="390" y="294" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400">拒绝路径：认证或授权失败即停止；不得等数据返回后再靠前端隐藏。</text><text x="390.0" y="335" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">示意省略具体 RBAC / ABAC 规则；后台任务与 Agent 工具也要带可信身份。</text>
</svg>