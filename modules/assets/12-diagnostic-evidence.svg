<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 457" width="780" height="457" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">接口 P99 激增：用证据区分计算、等待与 GC 压力</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="457" fill="#ffffff"/>

<path data-connector="true" d="M 390.0,137 C 390.0,172 137.5,111 137.5,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,137 L 390.0,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,137 C 390.0,172 642.5,111 642.5,146" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 137.5,216 L 137.5,225" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,216 L 390.0,225" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.5,216 L 642.5,225" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">接口 P99 激增：用证据区分计算、等待与 GC 压力</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">先确认真实用户影响、发生范围与时间，再选择能区分假设的观测</text><!-- symptom: x=277.5, y=78, w=225, h=54, right=502.5, bottom=132 --><rect data-node="symptom" x="277.5" y="78" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="symptom">同版本 / 同请求类型对比</text><text x="390.0" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="symptom">P99、错误率、吞吐一起看</text><!-- cpu: x=25, y=157, w=225, h=54, right=250, bottom=211 --><rect data-node="cpu" x="25" y="157" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="137.5" y="179.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cpu">计算压力假设</text><text x="137.5" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cpu">CPU 或调度等待升高</text><!-- wait: x=277.5, y=157, w=225, h=54, right=502.5, bottom=211 --><rect data-node="wait" x="277.5" y="157" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="179.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="wait">等待压力假设</text><text x="390.0" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="wait">CPU 不高、响应变慢</text><!-- gc: x=530, y=157, w=225, h=54, right=755, bottom=211 --><rect data-node="gc" x="530" y="157" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="179.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="gc">内存压力假设</text><text x="642.5" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="gc">分配 / GC 暂停同步变化</text><!-- cpu-e: x=25, y=236, w=225, h=90, right=250, bottom=326 --><rect data-node="cpu-e" x="25" y="236" width="225" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="137.5" y="258.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cpu-e">线程采样 / CPU profile</text><text x="137.5" y="276.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cpu-e">热点方法与调用栈</text><text x="137.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cpu-e">容器 CPU 配额与节流</text><text x="137.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cpu-e">区分忙循环、计算和调度</text><!-- wait-e: x=277.5, y=236, w=225, h=90, right=502.5, bottom=326 --><rect data-node="wait-e" x="277.5" y="236" width="225" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="258.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="wait-e">trace + 池指标 + 线程栈</text><text x="390.0" y="276.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="wait-e">拆连接等待 / SQL / 网络</text><text x="390.0" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="wait-e">核对锁等待与慢依赖</text><text x="390.0" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="wait-e">不要只凭低 CPU 就扩线程</text><!-- gc-e: x=530, y=236, w=225, h=90, right=755, bottom=326 --><rect data-node="gc-e" x="530" y="236" width="225" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="258.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="gc-e">GC 日志 / JFR</text><text x="642.5" y="276.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="gc-e">停顿时刻与请求对齐</text><text x="642.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="gc-e">GC 后存活量、分配率</text><text x="642.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="gc-e">区分缓存增长与泄漏</text><!-- verify: x=25, y=351, w=730, h=54, right=755, bottom=405 --><rect data-node="verify" x="25" y="351" width="730" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="373.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="verify">保留关键证据 → 可逆止损 → 对照验证 → 补故障实验与长期修复</text><text x="390.0" y="391.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="verify">例：回滚后连接池等待消失，继续追查事务持有时间；相关性支持假设，但不能替代因果验证。</text><text x="390.0" y="432" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">这是诊断分支，不是互斥分类：慢依赖可以引发排队、分配增长和 GC，多个证据需要对齐时间。</text>
</svg>