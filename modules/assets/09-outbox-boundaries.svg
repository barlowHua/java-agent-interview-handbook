<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 411" width="780" height="411" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Outbox：两个本地事务，中间允许重复投递</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="411" fill="#ffffff"/>
<rect data-group="order-tx" x="25" y="78" width="350" height="183" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="92" font-size="11" text-anchor="start" fill="#64748b">事务 A：订单数据库</text><rect data-group="fulfil-tx" x="405" y="78" width="350" height="183" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="415" y="92" font-size="11" text-anchor="start" fill="#64748b">事务 B：履约数据库</text>
<path data-connector="true" d="M 137.5,266 L 137.5,275" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 255,313.0 L 266.5,313.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 507.5,313.0 L 519,313.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 642.5,281 L 642.5,272" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Outbox：两个本地事务，中间允许重复投递</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">虚线框是原子提交边界；框之间的箭头不属于一个跨库事务</text><!-- orders: x=45, y=108, w=310, h=54, right=355, bottom=162 --><rect data-node="orders" x="45" y="108" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="200.0" y="130.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="orders">订单状态修改</text><text x="200.0" y="148.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="orders">订单 ID / 版本 / 请求唯一键</text><!-- outbox: x=45, y=187, w=310, h=54, right=355, bottom=241 --><rect data-node="outbox" x="45" y="187" width="310" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="200.0" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="outbox">Outbox 插入事件 E7</text><text x="200.0" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="outbox">与订单一起提交或一起回滚</text><!-- inbox: x=425, y=108, w=310, h=54, right=735, bottom=162 --><rect data-node="inbox" x="425" y="108" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="580.0" y="130.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="inbox">Inbox / processed_event</text><text x="580.0" y="148.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="inbox">唯一键 (consumer, event_id)</text><!-- fulfil: x=425, y=187, w=310, h=54, right=735, bottom=241 --><rect data-node="fulfil" x="425" y="187" width="310" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="580.0" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fulfil">创建履约任务</text><text x="580.0" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="fulfil">与去重记录一起提交或回滚</text><!-- relay: x=25, y=286, w=225, h=54, right=250, bottom=340 --><rect data-node="relay" x="25" y="286" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="137.5" y="308.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="relay">relay 轮询或 CDC</text><text x="137.5" y="326.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="relay">仅转发已提交事件</text><!-- broker: x=277.5, y=286, w=225, h=54, right=502.5, bottom=340 --><rect data-node="broker" x="277.5" y="286" width="225" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="308.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="broker">broker 保存并投递</text><text x="390.0" y="326.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="broker">同一个 E7 可能出现多次</text><!-- consumer: x=530, y=286, w=225, h=54, right=755, bottom=340 --><rect data-node="consumer" x="530" y="286" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="308.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="consumer">消费者处理 E7</text><text x="642.5" y="326.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="consumer">事务 B 提交后才确认</text><text x="390.0" y="370" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">发送确认后、记录发送进度前崩溃：relay 会重发 E7；事务 B 的唯一约束使业务效果不重复。</text><text x="390.0" y="386" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">Outbox 保证待发凭据与业务同生共灭；它不自动保证跨聚合顺序、及时送达或外部支付恰好一次。</text>
</svg>