<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 445" width="780" height="445" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">评测数据流：从固定任务到发布门禁与成本</title><desc id="diagram-desc">固定任务输入与标签，用冻结版本执行并记录 trace，分别评估组件、业务不变量和成本时延，再做发布门禁。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="445" fill="#ffffff"/>

<path data-connector="true" data-from="dataset" data-to="run" d="M 256,121.0 L 266,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="run" data-to="trace" d="M 508,121.0 L 518,121.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="trace" data-to="components" d="M 642,162 C 642,168 138,168 138,174" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="trace" data-to="business" d="M 642,162 C 642,168 390,168 390,174" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="trace" data-to="resources" d="M 642,162 C 642,168 642,168 642,174" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="components" data-to="release" d="M 138,262 L 138,274" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="business" data-to="release" d="M 390,262 L 390,274" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="resources" data-to="release" d="M 642,262 L 642,274" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">评测数据流：从固定任务到发布门禁与成本</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">评分器独立于被测系统；平均高分不能抵消越权、重复动作等关键失败</text><!-- dataset: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="dataset" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="dataset">固定任务与环境快照</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="dataset">问题、用户、证据、金标准</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="dataset">开发集与独立测试集分开</text><!-- run: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="run" x="277" y="85" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="run">冻结配置运行</text><text x="390.0" y="125.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="run">模型/prompt/schema/索引</text><text x="390.0" y="143.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="run">重复运行以观察输出波动</text><!-- trace: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="trace" x="529" y="85" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="trace">可回放 trace 与业务结果</text><text x="642.0" y="125.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="trace">路由、文档 ID、工具凭证</text><text x="642.0" y="143.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="trace">阶段耗时、usage、错误</text><!-- components: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="components" x="25" y="185" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="components">组件与开放回答评分</text><text x="138.0" y="225.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="components">Recall、参数、断言支持</text><text x="138.0" y="243.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="components">规则优先；模型裁判需校准</text><!-- business: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="business" x="277" y="185" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="business">任务与安全不变量</text><text x="390.0" y="225.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="business">正确对象？真实状态完成？</text><text x="390.0" y="243.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="business">重复动作/越权分别统计</text><!-- resources: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="resources" x="529" y="185" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="resources">运行资源与交付效率</text><text x="642.0" y="225.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="resources">关键路径、p50/p95/p99</text><text x="642.0" y="243.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="resources">调用+重试+工具+人工成本</text><!-- release: x=25, y=285, w=730, h=72, right=755, bottom=357 --><rect data-node="release" x="25" y="285" width="730" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="390.0" y="307.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="release">发布门禁：按任务分桶对比基线 → 小流量验证 → 持续收集失败 → 可回滚配置</text><text x="390.0" y="325.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="release">每成功任务成本 = 同一窗口内所有尝试的总成本 ÷ 完成业务目标的任务数</text><text x="390.0" y="343.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="release">成功数为 0 时该比值不可计算；不能排除失败与重试成本后宣布“更便宜”</text><text x="390.0" y="388" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">指标需固定分母、时间窗口和版本；影子评测不能再次执行真实写入副作用。</text><text x="390.0" y="404" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">延迟取实际端到端分布；不能将不同阶段各自的 p95 相加当作任务 p95。</text><text x="390.0" y="420" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">示意图没有给出企业通用上线阈值，门禁应由业务风险与 SLO 决定。</text>
</svg>