<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Prefill、首 token 与 Decode：缓存复用的位置</title><desc id="diagram-desc">Prefill 处理已有输入，并由末位结果预测首个新 token。后续 decode 读取历史 KV 和最近生成的 token，追加新 KV 并预测下一个 token。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="430" fill="#ffffff"/>

<path data-connector="true" data-from="prompt" data-to="prefill" d="M 256,121.0 L 266,121.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" data-from="prefill" data-to="first" d="M 508,121.0 L 518,121.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="prefill" data-to="cache" d="M 390,162 C 390,168 138,168 138,174" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="first" data-to="decode" d="M 642,162 C 642,168 430,168 430,174" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="cache" data-to="decode" d="M 256,221.0 L 266,221.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="decode" data-to="cache" d="M 272,242 L 262,242" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="decode" data-to="next" d="M 508,221.0 L 518,221.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="next" data-to="decode" d="M 642,262 C 642,321 390,321 390,268" fill="none" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Prefill、首 token 与 Decode：缓存复用的位置</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">单序列、标准自回归推理示意；首 token 可以由 prefill 的末位输出产生</text><!-- prompt: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="prompt" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="prompt">输入上下文 t₁…tₙ</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="prompt">指令、历史、工具、证据</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="prompt">先给输出预留 token 预算</text><!-- prefill: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="prefill" x="277" y="85" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="prefill">Prefill：计算输入各位置</text><text x="390.0" y="125.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="prefill">因果约束内可并行处理</text><text x="390.0" y="143.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="prefill">产生各层 KV 与末位 logits</text><!-- first: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="first" x="529" y="85" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="first">选择首个新 token tₙ₊₁</text><text x="642.0" y="125.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="first">此时可返回首段内容</text><text x="642.0" y="143.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="first">TTFT 还包含排队与网络</text><!-- cache: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="cache" x="25" y="185" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cache">KV cache：各层历史 K/V</text><text x="138.0" y="225.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cache">缓存已处理的位置</text><text x="138.0" y="243.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cache">后续追加，不重算全部前缀</text><!-- decode: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="decode" x="277" y="185" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="decode">Decode：输入刚生成的 token</text><text x="390.0" y="225.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="decode">读取已有 KV，计算新 KV</text><text x="390.0" y="243.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="decode">完成当前一步注意力与预测</text><!-- next: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="next" x="529" y="185" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="next">预测下一个 token</text><text x="642.0" y="225.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="next">检查结束符、长度与预算</text><text x="642.0" y="243.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="next">未结束则进入下一步</text><!-- memory: x=25, y=285, w=226, h=72, right=251, bottom=357 --><rect data-node="memory" x="25" y="285" width="226" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="138.0" y="307.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="memory">KV 显存的粗略量级</text><text x="138.0" y="325.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="memory">2 × L × T × Hkv × dh × b</text><text x="138.0" y="343.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="memory">不含模型权重与其他激活</text><text x="516" y="337" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="400">下一步：新 token 成为输入</text><text x="516" y="359" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">新 KV 在解码步骤中追加到缓存</text><text x="390.0" y="389" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">L=层数，T=缓存位置数，Hkv=KV 头数，dh=每头维度，b=每元素字节数。</text><text x="390.0" y="405" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">前缀缓存命中可以减少部分输入计算；不是答案缓存，也不消除后续 decode。</text>
</svg>