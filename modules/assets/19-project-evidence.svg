<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">项目回答：从背景到可验证的判断</title><desc id="diagram-desc">项目叙事六个相连部分：约束、备选方案、个人决策、验证证据、结果边界、复盘。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="350" fill="#ffffff"/>

<path data-connector="true" d="M 253,116.0 L 267,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507,116.0 L 521,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 644.0,157 L 644.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 527,216.0 L 513,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 273,216.0 L 259,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">项目回答：从背景到可验证的判断</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">每一条关键结论，都能回到事实、指标或实验</text><!-- constraints: x=24, y=80, w=224, h=72, right=248, bottom=152 --><rect data-node="constraints" x="24" y="80" width="224" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="constraints">1 背景与约束</text><text x="136.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="constraints">业务 / 规模 / 个人职责</text><!-- alternatives: x=278, y=80, w=224, h=72, right=502, bottom=152 --><rect data-node="alternatives" x="278" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="alternatives">2 比较可行方案</text><text x="390.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="alternatives">代价 / 风险 / 不选理由</text><!-- decision: x=532, y=80, w=224, h=72, right=756, bottom=152 --><rect data-node="decision" x="532" y="80" width="224" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="644.0" y="111.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="decision">3 明确个人判断</text><text x="644.0" y="129.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="decision">决策 / 实现 / 协作边界</text><!-- proof: x=532, y=180, w=224, h=72, right=756, bottom=252 --><rect data-node="proof" x="532" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="proof">4 提供验证证据</text><text x="644.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="proof">指标口径 / 原始记录</text><!-- result: x=278, y=180, w=224, h=72, right=502, bottom=252 --><rect data-node="result" x="278" y="180" width="224" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="211.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="result">5 说明结果与限制</text><text x="390.0" y="229.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="result">事实 / 估算 / 未知分开</text><!-- review: x=24, y=180, w=224, h=72, right=248, bottom=252 --><rect data-node="review" x="24" y="180" width="224" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="136.0" y="211.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="review">6 复盘与迁移</text><text x="136.0" y="229.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="review">失败原因 / 新约束取舍</text><text x="390" y="290" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">追问检验：规模 ×10、预算减半或一致性要求变化，原方案还成立吗？</text><text x="390.0" y="325" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">结构用于整理真实经历；练习结果不得包装成生产经历，缺失数据应明确说明。</text>
</svg>