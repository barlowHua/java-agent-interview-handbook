<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 358" width="780" height="358" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">健康探针：不同信号触发不同动作</title><desc id="diagram-desc">启动探针保护慢启动，就绪探针决定服务流量，存活探针决定是否重启。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="358" fill="#ffffff"/>

<path data-connector="true" d="M 140.0,147 L 140.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,147 L 390.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 640.0,147 L 640.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">健康探针：不同信号触发不同动作</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">三列是职责比较；探针成功不等于业务全链路一定成功</text><!-- startup: x=30, y=88, w=220, h=54, right=250, bottom=142 --><rect data-node="startup" x="30" y="88" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="140.0" y="110.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="startup">Startup 启动</text><text x="140.0" y="128.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="startup">启动是否在预算内完成？</text><!-- startup-action: x=30, y=180, w=220, h=72, right=250, bottom=252 --><rect data-node="startup-action" x="30" y="180" width="220" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="140.0" y="202.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="startup-action">成功后进入常规探测</text><text x="140.0" y="220.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="startup-action">启动未成功时抑制</text><text x="140.0" y="238.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="startup-action">常规存活 / 就绪探测</text><!-- ready: x=280, y=88, w=220, h=54, right=500, bottom=142 --><rect data-node="ready" x="280" y="88" width="220" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="110.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready">Readiness 就绪</text><text x="390.0" y="128.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready">现在能接受新请求吗？</text><!-- ready-action: x=280, y=180, w=220, h=72, right=500, bottom=252 --><rect data-node="ready-action" x="280" y="180" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready-action">未就绪：停止承接</text><text x="390.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready-action">经 Service 路由的新流量</text><text x="390.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready-action">不因就绪失败直接重启</text><!-- live: x=530, y=88, w=220, h=54, right=750, bottom=142 --><rect data-node="live" x="530" y="88" width="220" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="640.0" y="110.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="live">Liveness 存活</text><text x="640.0" y="128.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="live">进程是否失活需重启？</text><!-- live-action: x=530, y=180, w=220, h=72, right=750, bottom=252 --><rect data-node="live-action" x="530" y="180" width="220" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="640.0" y="202.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="live-action">失败达到配置阈值</text><text x="640.0" y="220.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="live-action">按重启策略处理容器</text><text x="640.0" y="238.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="live-action">慎将下游故障作为条件</text><text x="390.0" y="317" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">数据库短暂抖动 → 所有实例存活失败 → 全体重启，可能扩大事故。</text><text x="390.0" y="333" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">探针阈值与时间预算要结合应用启动、摘流传播和真实恢复行为验证。</text>
</svg>