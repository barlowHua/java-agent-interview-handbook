<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 419" width="780" height="419" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">ZooKeeper 锁配方：监听前驱，醒来后重新判断资格</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="419" fill="#ffffff"/>

<path data-connector="true" d="M 272.5,114.0 L 261,114.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 525,114.0 L 513.5,114.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 137.5,155 L 137.5,164" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 255,211.0 L 266.5,211.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 137.5,252 L 137.5,261" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 255,308.0 L 266.5,308.0" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 525,308.0 L 513.5,308.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 390.0,252 C 390.0,287 642.5,226 642.5,261" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">ZooKeeper 锁配方：监听前驱，醒来后重新判断资格</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">同一父路径下创建临时顺序节点；第一行箭头表示“监听直接前驱”，不是业务写入</text><!-- a: x=25, y=78, w=225, h=72, right=250, bottom=150 --><rect data-node="a" x="25" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a">A：lock-0001</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a">序号最小，取得资格</text><text x="137.5" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a">节点依附 A 的 session</text><!-- b: x=277.5, y=78, w=225, h=72, right=502.5, bottom=150 --><rect data-node="b" x="277.5" y="78" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b">B：lock-0002</text><text x="390.0" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b">等待并 watch A</text><text x="390.0" y="136.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="b">只监听直接前驱</text><!-- c: x=530, y=78, w=225, h=72, right=755, bottom=150 --><rect data-node="c" x="530" y="78" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="c">C：lock-0003</text><text x="642.5" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="c">等待并 watch B</text><text x="642.5" y="136.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="c">避免全部竞争者被唤醒</text><!-- expired: x=25, y=175, w=225, h=72, right=250, bottom=247 --><rect data-node="expired" x="25" y="175" width="225" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="137.5" y="197.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="expired">服务端判定 A 会话过期</text><text x="137.5" y="215.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="expired">删除 lock-0001</text><text x="137.5" y="233.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="expired">短暂断线不等于立即过期</text><!-- notify: x=277.5, y=175, w=225, h=72, right=502.5, bottom=247 --><rect data-node="notify" x="277.5" y="175" width="225" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="197.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="notify">B 收到变化通知</text><text x="390.0" y="215.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="notify">重读候选列表并检查</text><text x="390.0" y="233.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="notify">重新注册所需 watch</text><!-- still: x=530, y=175, w=225, h=72, right=755, bottom=247 --><rect data-node="still" x="530" y="175" width="225" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="642.5" y="197.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="still">C 的前驱 B 仍存在</text><text x="642.5" y="215.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="still">继续等待 B 的变化</text><text x="642.5" y="233.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="still">不凭别人的通知抢占</text><!-- old: x=25, y=272, w=225, h=72, right=250, bottom=344 --><rect data-node="old" x="25" y="272" width="225" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="137.5" y="294.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="old">A 的旧进程可能恢复</text><text x="137.5" y="312.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="old">会话节点已消失</text><text x="137.5" y="330.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="old">但进程仍可能发出旧写入</text><!-- resource: x=277.5, y=272, w=225, h=72, right=502.5, bottom=344 --><rect data-node="resource" x="277.5" y="272" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="resource">资源端：原子校验 token</text><text x="390.0" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="resource">已记录 B 的更新 token</text><text x="390.0" y="330.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="resource">拒绝随后到达的 A 旧写</text><!-- holder: x=530, y=272, w=225, h=72, right=755, bottom=344 --><rect data-node="holder" x="530" y="272" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="642.5" y="294.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="holder">B 重查后成为最小者</text><text x="642.5" y="312.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="holder">获得新的有效资格</text><text x="642.5" y="330.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="holder">携带可验证 token 写入</text><text x="390.0" y="378" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">watch 是重读状态的提示，不是完整事件日志；前驱已删除时要重新计算，不能永久等待旧事件。</text><text x="390.0" y="394" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">下层栅栏属于业务资源的额外机制，ZooKeeper 锁本身不会自动阻止旧进程写入外部数据库。</text>
</svg>