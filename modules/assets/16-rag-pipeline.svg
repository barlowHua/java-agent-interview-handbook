<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 425" width="780" height="425" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">RAG 双链路：建库更新与带权限的在线回答</title><desc id="diagram-desc">上排为离线解析建库，下两排为在线查询与生成。可信身份约束召回，原文权限和生效版本在重排与生成前检查。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="425" fill="#ffffff"/>

<path data-connector="true" data-from="source" data-to="chunks" d="M 256,121.0 L 266,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="chunks" data-to="index" d="M 508,121.0 L 518,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="request" data-to="scope" d="M 256,221.0 L 266,221.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="scope" data-to="retrieve" d="M 508,221.0 L 518,221.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="index" data-to="retrieve" d="M 642.0,162 L 642.0,174" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="retrieve" data-to="rerank" d="M 642.0,262 L 642.0,274" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="rerank" data-to="context" d="M 524,321.0 L 514,321.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" data-from="context" data-to="answer" d="M 272,321.0 L 262,321.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">RAG 双链路：建库更新与带权限的在线回答</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">索引保存可检索表示；权威原文、文档版本和权限来源必须可追溯</text><!-- source: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="source" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="source">离线：受控源文档</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="source">内容、版本、生效时间</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="source">授权范围与来源定位</text><!-- chunks: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="chunks" x="277" y="85" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="chunks">解析、去重、结构化分块</text><text x="390.0" y="125.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="chunks">保留 docId / chunkId / ACL</text><text x="390.0" y="143.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="chunks">词法字段 + embedding</text><!-- index: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="index" x="529" y="85" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="index">倒排索引 + 向量索引</text><text x="642.0" y="125.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="index">关联原文库及权限版本</text><text x="642.0" y="143.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="index">更新时清理旧块和墓碑</text><!-- request: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="request" x="25" y="185" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="request">在线：问题 + 已认证用户</text><text x="138.0" y="225.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="request">先识别意图与必要条件</text><text x="138.0" y="243.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="request">余额/库存转权威业务 API</text><!-- scope: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="scope" x="277" y="185" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">可信身份 → 检索范围</text><text x="390.0" y="225.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">租户、ACL、生效范围</text><text x="390.0" y="243.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">查询改写不能扩大权限</text><!-- retrieve: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="retrieve" x="529" y="185" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="retrieve">词法 + 向量候选召回</text><text x="642.0" y="225.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="retrieve">执行可信范围过滤</text><text x="642.0" y="243.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="retrieve">读取原文时重新检查授权</text><!-- rerank: x=529, y=285, w=226, h=72, right=755, bottom=357 --><rect data-node="rerank" x="529" y="285" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.0" y="307.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="rerank">去重、融合、重排</text><text x="642.0" y="325.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="rerank">只处理已经授权的候选</text><text x="642.0" y="343.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="rerank">重排不能补回漏召回文档</text><!-- context: x=277, y=285, w=226, h=72, right=503, bottom=357 --><rect data-node="context" x="277" y="285" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="307.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="context">证据装配与输出前策略</text><text x="390.0" y="325.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="context">版本、引用位置、token 预算</text><text x="390.0" y="343.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="context">缺失必要条件则澄清/拒答</text><!-- answer: x=25, y=285, w=226, h=72, right=251, bottom=357 --><rect data-node="answer" x="25" y="285" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="138.0" y="307.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="answer">生成回答并验证逐条引用</text><text x="138.0" y="325.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="answer">事实是否被证据支持？</text><text x="138.0" y="343.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="answer">业务所需条件是否完整？</text><text x="390.0" y="384" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">离线权限元数据可能滞后：定义撤销时限、校验点和缓存失效策略，不能只信索引标签。</text><text x="390.0" y="400" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">知识问答主路径示意；省略查询规划和无答案分支的具体实现，但它们必须有显式行为。</text>
</svg>