<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" width="780" height="418" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">领域边界：聚合内守住不变量，跨边界显式协调</title><desc id="diagram-desc">订单应用服务调用订单聚合，聚合内事务保存订单与明细及Outbox，独立库存服务消费事件并回复结果。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="418" fill="#ffffff"/>

<path data-connector="true" d="M 255,124.0 L 269,124.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 505,124.0 L 519,124.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 525,250.0 L 511,250.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 275,250.0 L 261,250.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 640.0,165 L 640.0,203" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">领域边界：聚合内守住不变量，跨边界显式协调</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">教学示例：聚合边界由一致性规则决定，不按表数量机械划分</text><!-- command: x=30, y=88, w=220, h=72, right=250, bottom=160 --><rect data-node="command" x="30" y="88" width="220" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="140.0" y="110.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="command">应用服务</text><text x="140.0" y="128.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="command">身份 / 幂等 / 用例编排</text><text x="140.0" y="146.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="command">调用领域行为</text><!-- aggregate: x=280, y=88, w=220, h=72, right=500, bottom=160 --><rect data-node="aggregate" x="280" y="88" width="220" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="110.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">订单聚合根</text><text x="390.0" y="128.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">验证状态与金额不变量</text><text x="390.0" y="146.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">控制订单明细变更</text><!-- commit: x=530, y=88, w=220, h=72, right=750, bottom=160 --><rect data-node="commit" x="530" y="88" width="220" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="640.0" y="110.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="commit">本地事务</text><text x="640.0" y="128.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="commit">订单 + 明细 + Outbox</text><text x="640.0" y="146.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="commit">共同提交或回滚</text><!-- result: x=30, y=214, w=220, h=72, right=250, bottom=286 --><rect data-node="result" x="30" y="214" width="220" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="140.0" y="236.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">订单继续推进</text><text x="140.0" y="254.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">根据结果条件更新</text><text x="140.0" y="272.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="result">接受中间状态与补偿</text><!-- inventory: x=280, y=214, w=220, h=72, right=500, bottom=286 --><rect data-node="inventory" x="280" y="214" width="220" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="236.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="inventory">库存边界</text><text x="390.0" y="254.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="inventory">自己的可用量不变量</text><text x="390.0" y="272.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="inventory">预留请求按业务键幂等</text><!-- event: x=530, y=214, w=220, h=72, right=750, bottom=286 --><rect data-node="event" x="530" y="214" width="220" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="640.0" y="236.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="event">集成事件</text><text x="640.0" y="254.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="event">已提交事实 / 版本 / ID</text><text x="640.0" y="272.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="event">异步可靠投递</text><text x="390" y="328" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">跨服务没有图中隐含的“大事务”；失败要定义重试、查询、对账与业务补偿。</text><text x="390.0" y="377" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">聚合可以有多张表；分服务后仍需说明事实来源、状态机及并发条件。</text><text x="390.0" y="393" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">闭卷重画：把“取消”和“支付成功”竞争补入订单聚合。</text>
</svg>