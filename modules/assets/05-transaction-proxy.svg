<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 307" width="780" height="307" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Spring 事务代理：边界取决于调用是否穿过拦截器</title><desc id="diagram-desc">外部调用穿过代理进入 outer，内部 this.inner 不再次触发事务拦截；同线程 DAO 可参与已有事务，最终由外层拦截器完成事务。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="307" fill="#ffffff"/>

<path data-connector="true" d="M 256,116.0 L 266,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 508,116.0 L 518,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.0,157 L 642.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 524,216.0 L 514,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 272,216.0 L 262,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Spring 事务代理：边界取决于调用是否穿过拦截器</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">命令式 JDBC＋默认代理模式；本例 outer 开启事务，再调用 this.inner</text><!-- caller: x=25, y=80, w=226, h=72, right=251, bottom=152 --><rect data-node="caller" x="25" y="80" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="102.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller">① 外部调用</text><text x="138.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller">调用者持有代理引用</text><text x="138.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="caller">执行 outer()</text><!-- proxy: x=277, y=80, w=226, h=72, right=503, bottom=152 --><rect data-node="proxy" x="277" y="80" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="102.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="proxy">② 事务拦截器</text><text x="390.0" y="120.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="proxy">读取事务配置与传播规则</text><text x="390.0" y="138.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="proxy">创建 / 参与事务</text><!-- outer: x=529, y=80, w=226, h=72, right=755, bottom=152 --><rect data-node="outer" x="529" y="80" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="outer">③ 目标对象 outer()</text><text x="642.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="outer">开始执行业务逻辑</text><text x="642.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="outer">继续调用 this.inner()</text><!-- inner: x=529, y=180, w=226, h=72, right=755, bottom=252 --><rect data-node="inner" x="529" y="180" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="202.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="inner">④ this.inner()</text><text x="642.0" y="220.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="inner">不重新经过代理</text><text x="642.0" y="238.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="inner">内层注解不重新生效</text><!-- database: x=277, y=180, w=226, h=72, right=503, bottom=252 --><rect data-node="database" x="277" y="180" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="database">⑤ DAO / 数据库</text><text x="390.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="database">使用同线程、同事务资源</text><text x="390.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="database">仍可参与外层物理事务</text><!-- finish: x=25, y=180, w=226, h=72, right=251, bottom=252 --><rect data-node="finish" x="25" y="180" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="138.0" y="202.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="finish">⑥ 控制返回拦截器</text><text x="138.0" y="220.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="finish">依据结果与回滚标记处理</text><text x="138.0" y="238.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="finish">提交 / 回滚，清理绑定</text><text x="390.0" y="282" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">inner 标注 REQUIRES_NEW 也不会在自调用时新开事务；“注解未拦截”不等于“必定无事务”。</text>
</svg>