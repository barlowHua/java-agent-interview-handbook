<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 405" width="780" height="405" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Spring Bean 生命周期：定义、实例、代理与销毁</title><desc id="diagram-desc">展示典型应用单例从 BeanDefinition 处理到实例化、依赖填充、初始化、后置代理、使用与销毁的主要路径。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="405" fill="#ffffff"/>

<path data-connector="true" d="M 256,116.0 L 266,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 508,116.0 L 518,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.0,157 L 642.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 524,216.0 L 514,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 272,216.0 L 262,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 138.0,257 L 138.0,269" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 256,316.0 L 266,316.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Spring Bean 生命周期：定义、实例、代理与销毁</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">按 ①→⑧ 蛇形阅读；这是典型应用单例主线，真实容器有提前引用等分支</text><!-- definition: x=25, y=80, w=226, h=72, right=251, bottom=152 --><rect data-node="definition" x="25" y="80" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="102.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="definition">① 注册 / 修改 BeanDefinition</text><text x="138.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="definition">BeanFactoryPostProcessor</text><text x="138.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="definition">处理定义与配置元数据</text><!-- instance: x=277, y=80, w=226, h=72, right=503, bottom=152 --><rect data-node="instance" x="277" y="80" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="instance">② 实例化</text><text x="390.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="instance">选择构造器 / 工厂方法</text><text x="390.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="instance">得到对象实例</text><!-- populate: x=529, y=80, w=226, h=72, right=755, bottom=152 --><rect data-node="populate" x="529" y="80" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="populate">③ 填充依赖</text><text x="642.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="populate">属性注入等扩展处理</text><text x="642.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="populate">@Autowired 也依赖后处理器</text><!-- before: x=529, y=180, w=226, h=72, right=755, bottom=252 --><rect data-node="before" x="529" y="180" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.0" y="202.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="before">④ 初始化入口</text><text x="642.0" y="220.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="before">Aware / 初始化前 BPP</text><text x="642.0" y="238.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="before">其中可触发 @PostConstruct</text><!-- init: x=277, y=180, w=226, h=72, right=503, bottom=252 --><rect data-node="init" x="277" y="180" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="init">⑤ 初始化方法</text><text x="390.0" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="init">afterPropertiesSet()</text><text x="390.0" y="238.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="init">然后执行自定义 init-method</text><!-- after: x=25, y=180, w=226, h=72, right=251, bottom=252 --><rect data-node="after" x="25" y="180" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="138.0" y="202.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="after">⑥ 初始化后 BPP</text><text x="138.0" y="220.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="after">可将对象包装成 AOP 代理</text><text x="138.0" y="238.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="after">对外暴露最终对象</text><!-- ready: x=25, y=280, w=226, h=72, right=251, bottom=352 --><rect data-node="ready" x="25" y="280" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="138.0" y="302.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready">⑦ 被其他对象使用</text><text x="138.0" y="320.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready">单例不自动获得线程安全</text><text x="138.0" y="338.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ready">调用仍受代理边界约束</text><!-- destroy: x=277, y=280, w=226, h=72, right=503, bottom=352 --><rect data-node="destroy" x="277" y="280" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="302.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="destroy">⑧ 容器关闭：销毁回调</text><text x="390.0" y="320.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="destroy">@PreDestroy → destroy()</text><text x="390.0" y="338.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="destroy">→ 自定义 destroy-method</text><!-- scope: x=529, y=280, w=226, h=72, right=755, bottom=352 --><rect data-node="scope" x="529" y="280" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="302.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">作用域边界：prototype</text><text x="642.0" y="320.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">容器负责创建与初始化</text><text x="642.0" y="338.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="scope">不自动执行完整销毁回调</text><text x="390.0" y="380" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">BPP = BeanPostProcessor：处理实例；FactoryPostProcessor：处理定义，不能混为一谈。</text>
</svg>