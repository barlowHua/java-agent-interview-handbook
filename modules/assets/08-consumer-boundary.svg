<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 391" width="780" height="391" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">消费确认：业务已提交，才允许推进连续完成边界</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="391" fill="#ffffff"/>
<rect data-group="consume-tx" x="277.5" y="78" width="225" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="287.5" y="92" font-size="11" text-anchor="start" fill="#64748b">同一本地事务：共同提交或回滚</text>
<path data-connector="true" d="M 255,114 L 266.5,114" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,114 L 519,114" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 255,202.0 L 266.5,202.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,202.0 L 519,202.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 137.5,234 L 137.5,243" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 390.0,234 L 390.0,243" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 642.5,234 L 642.5,243" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">消费确认：业务已提交，才允许推进连续完成边界</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">上半图为本地业务事务；下半图以 Kafka 单分区 offset 为例</text><!-- delivery: x=25, y=78, w=225, h=72, right=250, bottom=150 --><rect data-node="delivery" x="25" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="delivery">消息 event_id=E7</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="delivery">broker 投递 / consumer poll</text><text x="137.5" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="delivery">可能重复到达</text><text x="390" y="116" font-size="12" fill="#166534" text-anchor="middle" font-weight="400">去重唯一键 + 业务变更</text><text x="390" y="137" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">提交成功后再向外确认</text><!-- ack: x=530, y=78, w=225, h=72, right=755, bottom=150 --><rect data-node="ack" x="530" y="78" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ack">RabbitMQ ack</text><text x="642.5" y="118.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ack">或 Kafka 提交下一读取位置</text><text x="642.5" y="136.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="ack">丢确认 → 重投 → 幂等挡住</text><!-- o10: x=25, y=175, w=225, h=54, right=250, bottom=229 --><rect data-node="o10" x="25" y="175" width="225" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="137.5" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="o10">offset 10：已完成</text><text x="137.5" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="o10">若此前都完成，可提交 11</text><!-- o11: x=277.5, y=175, w=225, h=54, right=502.5, bottom=229 --><rect data-node="o11" x="277.5" y="175" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="o11">offset 11：仍在处理</text><text x="390.0" y="215.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="o11">当前空洞：禁止跨过</text><!-- o12: x=530, y=175, w=225, h=54, right=755, bottom=229 --><rect data-node="o12" x="530" y="175" width="225" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="o12">offset 12：已完成</text><text x="642.5" y="215.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="o12">不能据此直接提交 13</text><!-- restart: x=25, y=254, w=225, h=72, right=250, bottom=326 --><rect data-node="restart" x="25" y="254" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="137.5" y="276.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restart">正确恢复：从 11 重读</text><text x="137.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restart">11 继续处理</text><text x="137.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restart">12 可能重复，由幂等裁决</text><!-- watermark: x=277.5, y=254, w=225, h=72, right=502.5, bottom=326 --><rect data-node="watermark" x="277.5" y="254" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="276.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="watermark">11 完成后形成连续前缀</text><text x="390.0" y="294.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="watermark">10、11、12 均已成功</text><text x="390.0" y="312.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="watermark">此时可提交 13</text><!-- loss: x=530, y=254, w=225, h=72, right=755, bottom=326 --><rect data-node="loss" x="530" y="254" width="225" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.5" y="276.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="loss">错误：提前提交 13</text><text x="642.5" y="294.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="loss">重启从 13 读取</text><text x="642.5" y="312.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="loss">未完成的 11 被跳过</text><text x="390.0" y="350" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">Kafka 已拉取的位置 ≠ 已完成的位置；RabbitMQ 批量 ack 也不能越过未完成的投递。</text><text x="390.0" y="366" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">分区 / channel 的确认规则不同；外部 HTTP 副作用不参加上图数据库事务，须另做幂等或查询。</text>
</svg>