<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 334" width="780" height="334" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">B+ 树：二级索引定位与回表是两次树查找</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="334" fill="#ffffff"/>
<rect data-group="secondary" x="25" y="78" width="350" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="92" font-size="11" text-anchor="start" fill="#64748b">二级索引：按 (status, id) 排序</text><rect data-group="clustered" x="405" y="78" width="350" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="415" y="92" font-size="11" text-anchor="start" fill="#64748b">聚簇索引：按主键 id 排序</text>
<path data-connector="true" d="M 200.0,167 C 200.0,197.91666666666666 116.25,145.08333333333334 116.25,176" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 200.0,167 C 200.0,197.91666666666666 283.75,145.08333333333334 283.75,176" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 580.0,167 C 580.0,197.91666666666666 496.25,145.08333333333334 496.25,176" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" d="M 580.0,167 C 580.0,197.91666666666666 663.75,145.08333333333334 663.75,176" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 192.5,214.0 L 201.5,214.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 572.5,214.0 L 581.5,214.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 360,214 C 390,214 384,135 414,135" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">B+ 树：二级索引定位与回表是两次树查找</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">示意索引 (status, id)，查询 status=PAID 并返回 amount；页与记录数量被简化</text><!-- sroot: x=45, y=108, w=310, h=54, right=355, bottom=162 --><rect data-node="sroot" x="45" y="108" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="200.0" y="130.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="sroot">非叶页：分隔键 + 子页指针</text><text x="200.0" y="148.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="sroot">① 选择包含 PAID 的子页</text><!-- sleaf1: x=45, y=187, w=142.5, h=54, right=187.5, bottom=241 --><rect data-node="sleaf1" x="45" y="187" width="142.5" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="116.25" y="209.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="sleaf1">叶页：CANCELLED</text><text x="116.25" y="227.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="sleaf1">… 主键 id …</text><!-- sleaf2: x=212.5, y=187, w=142.5, h=54, right=355.0, bottom=241 --><rect data-node="sleaf2" x="212.5" y="187" width="142.5" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="283.75" y="209.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="sleaf2">叶页：PAID</text><text x="283.75" y="227.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="sleaf2">id=42，id=58</text><!-- proot: x=425, y=108, w=310, h=54, right=735, bottom=162 --><rect data-node="proot" x="425" y="108" width="310" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="580.0" y="130.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proot">② 以主键 id=42 再定位</text><text x="580.0" y="148.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="proot">非叶页：键 + 子页指针</text><!-- pleaf1: x=425, y=187, w=142.5, h=54, right=567.5, bottom=241 --><rect data-node="pleaf1" x="425" y="187" width="142.5" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="496.25" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="pleaf1">叶页：完整行</text><text x="496.25" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="pleaf1">id=42, amount=99</text><!-- pleaf2: x=592.5, y=187, w=142.5, h=54, right=735.0, bottom=241 --><rect data-node="pleaf2" x="592.5" y="187" width="142.5" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="663.75" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="pleaf2">相邻叶页</text><text x="663.75" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="pleaf2">id=58, amount=80</text><text x="390.0" y="293" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">横向叶页连接用于范围扫描；箭头只画前进方向，省略反向链与中间页。</text><text x="390.0" y="309" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">只取 status、id 时可能覆盖；树高、Buffer Pool 命中和 MVCC 检查共同决定访问成本。</text>
</svg>