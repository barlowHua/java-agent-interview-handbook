<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 495" width="780" height="495" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Agent 工具循环：模型提议，运行时执行与记账</title><desc id="diagram-desc">上面六个节点构成工具循环，状态持久化后重建上下文。下面区分对话、长期记忆和外部资料，所有输入按来源和权限治理。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="495" fill="#ffffff"/>

<path data-connector="true" data-from="context" data-to="model" d="M 256,121.0 L 266,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="model" data-to="gate" d="M 508,121.0 L 518,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="gate" data-to="tool" d="M 642.0,162 L 642.0,174" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" data-from="tool" data-to="observe" d="M 524,221.0 L 514,221.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="observe" data-to="state" d="M 272,221.0 L 262,221.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="state" data-to="context" d="M 138.0,180 L 138.0,168" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Agent 工具循环：模型提议，运行时执行与记账</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">沿顺时针阅读；只有可信执行层可以把提议变成业务动作</text><!-- context: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="context" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="context">上下文装配</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="context">当前输入 + 已授权事实</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="context">保留来源与 token 预算</text><!-- model: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="model" x="277" y="85" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">模型调用</text><text x="390.0" y="125.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">回答候选或工具调用提议</text><text x="390.0" y="143.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="model">模型不能授予业务权限</text><!-- gate: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="gate" x="529" y="85" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">可信执行门禁</text><text x="642.0" y="125.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">schema、对象授权、业务条件</text><text x="642.0" y="143.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="gate">预算/审批；先落库动作意图</text><!-- tool: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="tool" x="529" y="185" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="tool">业务工具或 MCP 适配</text><text x="642.0" y="225.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="tool">身份由服务端注入</text><text x="642.0" y="243.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="tool">限时执行；写入使用幂等键</text><!-- observe: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="observe" x="277" y="185" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="observe">观察结果与终止判断</text><text x="390.0" y="225.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="observe">校验业务真实状态</text><text x="390.0" y="243.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="observe">继续 / 完成 / 等待 / 失败</text><!-- state: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="state" x="25" y="185" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="state">持久化运行状态</text><text x="138.0" y="225.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="state">意图、结果、版本、预算</text><text x="138.0" y="243.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="state">恢复不能仅依赖聊天摘要</text><text x="390" y="289" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">装配层按任务读取的三类资料：不能混成同一可信事实库</text><!-- conversation: x=25, y=315, w=226, h=90, right=251, bottom=405 --><rect data-node="conversation" x="25" y="315" width="226" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="346.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="conversation">对话历史</text><text x="138.0" y="364.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="conversation">保留近期信息与原始引用</text><text x="138.0" y="382.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="conversation">可压缩，但不是交易账本</text><!-- memory: x=277, y=315, w=226, h=90, right=503, bottom=405 --><rect data-node="memory" x="277" y="315" width="226" height="90" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="346.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="memory">长期记忆</text><text x="390.0" y="364.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="memory">来源、时效与用户隔离</text><text x="390.0" y="382.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="memory">事实确认后才能写入</text><!-- external: x=529, y=315, w=226, h=90, right=755, bottom=405 --><rect data-node="external" x="529" y="315" width="226" height="90" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="346.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="external">外部资料与工具返回</text><text x="642.0" y="364.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="external">检索文本可以携带恶意指令</text><text x="642.0" y="382.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="external">只作为数据，不替用户授权</text><text x="390.0" y="438" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">下排是数据治理分类，不是新增执行步骤；运行状态与长期记忆分别存储和管理。</text><text x="390.0" y="454" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">副作用的动作意图必须在工具执行前落库；图中的状态节点还负责后续结果记录与恢复。</text><text x="390.0" y="470" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">只读查询同样需要对象权限；停止循环依据预算和外部可验证结果，而非模型自称完成。</text>
</svg>