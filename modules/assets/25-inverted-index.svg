<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 409" width="780" height="409" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">搜索索引：从词项找到文档，再按相关性返回</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="409" fill="#ffffff"/>

<path data-connector="true" d="M 255,114.0 L 266.5,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,114.0 L 519,114.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 255,211.0 L 266.5,211.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,211.0 L 519,211.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.5,155 L 642.5,164" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 642.5,252 L 642.5,261" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 525,308.0 L 513.5,308.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 272.5,308.0 L 261,308.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">搜索索引：从词项找到文档，再按相关性返回</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">最小教学语料：D1=“java 缓存”，D2=“java 事务”；省略词频、位置等细节</text><!-- docs: x=25, y=78, w=225, h=72, right=250, bottom=150 --><rect data-node="docs" x="25" y="78" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="docs">原始文档</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="docs">D1：java 缓存</text><text x="137.5" y="136.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="docs">D2：java 事务</text><!-- analyze: x=277.5, y=78, w=225, h=72, right=502.5, bottom=150 --><rect data-node="analyze" x="277.5" y="78" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="analyze">索引分析器</text><text x="390.0" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="analyze">规范化、分词、过滤</text><text x="390.0" y="136.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="analyze">写入词项与文档关系</text><!-- postings: x=530, y=78, w=225, h=72, right=755, bottom=150 --><rect data-node="postings" x="530" y="78" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="postings">倒排表 postings</text><text x="642.5" y="118.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="postings">java → D1,D2</text><text x="642.5" y="136.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="postings">缓存 → D1；事务 → D2</text><!-- query: x=25, y=175, w=225, h=72, right=250, bottom=247 --><rect data-node="query" x="25" y="175" width="225" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="197.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="query">用户查询：java 缓存</text><text x="137.5" y="215.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="query">本例采用 AND 语义</text><text x="137.5" y="233.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="query">同时带租户与 ACL 条件</text><!-- q-analyze: x=277.5, y=175, w=225, h=72, right=502.5, bottom=247 --><rect data-node="q-analyze" x="277.5" y="175" width="225" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="197.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="q-analyze">查询分析器</text><text x="390.0" y="215.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="q-analyze">java、缓存</text><text x="390.0" y="233.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="q-analyze">分析规则须与索引兼容</text><!-- match: x=530, y=175, w=225, h=72, right=755, bottom=247 --><rect data-node="match" x="530" y="175" width="225" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.5" y="197.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="match">取词项对应文档集合</text><text x="642.5" y="215.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="match">java ∩ 缓存</text><text x="642.5" y="233.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="match">并应用授权过滤</text><!-- result: x=25, y=272, w=225, h=72, right=250, bottom=344 --><rect data-node="result" x="25" y="272" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="137.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="result">结果：D1</text><text x="137.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="result">带原文片段与必要字段</text><text x="137.5" y="330.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="result">最终顺序符合排序契约</text><!-- score: x=277.5, y=272, w=225, h=72, right=502.5, bottom=344 --><rect data-node="score" x="277.5" y="272" width="225" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="294.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="score">对候选计算相关性</text><text x="390.0" y="312.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="score">BM25：词频、稀有度、长度</text><text x="390.0" y="330.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="score">分数不代表事实正确概率</text><!-- candidate: x=530, y=272, w=225, h=72, right=755, bottom=344 --><rect data-node="candidate" x="530" y="272" width="225" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.5" y="294.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="candidate">候选文档 D1</text><text x="642.5" y="312.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="candidate">读取评分需要的统计</text><text x="642.5" y="330.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="candidate">越权文档不能进入结果</text><text x="390.0" y="368" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">倒排索引：词项 → 文档；doc values：文档 → 字段值，常用于排序和聚合。</text><text x="390.0" y="384" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">实际系统还需分片归并、分析器版本和更新可见性；本图不是某个生产集群的完整部署图。</text>
</svg>