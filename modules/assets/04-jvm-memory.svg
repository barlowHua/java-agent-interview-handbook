<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">JVM 内存：线程执行状态、Java 堆与本地开销</title><desc id="diagram-desc">线程私有的执行状态可持有指向共享堆的引用；HotSpot 进程还包含元空间、代码缓存、直接内存等，不受 Xmx 统一限制。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="350" fill="#ffffff"/>
<rect data-group="thread" x="25" y="75" width="226" height="222" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="89" font-size="11" text-anchor="start" fill="#64748b">线程私有：每线程一份</text><rect data-group="heap" x="277" y="75" width="226" height="222" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="287" y="89" font-size="11" text-anchor="start" fill="#64748b">共享：Java 堆</text><rect data-group="native" x="529" y="75" width="226" height="222" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="539" y="89" font-size="11" text-anchor="start" fill="#64748b">HotSpot 本地内存：部分</text>
<path data-connector="true" d="M 236,146.0 L 286,146.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">JVM 内存：线程执行状态、Java 堆与本地开销</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">规范运行时区域与 HotSpot 进程内存的教学映射；并非操作系统虚拟地址排列图</text><!-- frames: x=45, y=110, w=186, h=72, right=231, bottom=182 --><rect data-node="frames" x="45" y="110" width="186" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="132.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="frames">PC / JVM 栈</text><text x="138.0" y="150.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="frames">帧保存局部变量与操作数</text><text x="138.0" y="168.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="frames">局部变量可持有对象引用</text><!-- native-stack: x=45, y=210, w=186, h=54, right=231, bottom=264 --><rect data-node="native-stack" x="45" y="210" width="186" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="232.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="native-stack">本地方法栈</text><text x="138.0" y="250.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="native-stack">实现可与 JVM 栈结合</text><!-- objects: x=297, y=110, w=186, h=72, right=483, bottom=182 --><rect data-node="objects" x="297" y="110" width="186" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="132.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="objects">对象 / 数组</text><text x="390.0" y="150.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="objects">业务对象与关联引用</text><text x="390.0" y="168.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="objects">GC 的主要工作集</text><!-- class-mirror: x=297, y=210, w=186, h=54, right=483, bottom=264 --><rect data-node="class-mirror" x="297" y="210" width="186" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="232.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="class-mirror">Class 镜像等堆对象</text><text x="390.0" y="250.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="class-mirror">不能全部算进元空间</text><!-- native-areas: x=549, y=110, w=186, h=72, right=735, bottom=182 --><rect data-node="native-areas" x="549" y="110" width="186" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="132.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="native-areas">元空间：类元数据</text><text x="642.0" y="150.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="native-areas">代码缓存：JIT 机器码</text><text x="642.0" y="168.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="native-areas">直接内存 / 本地库分配</text><!-- budget: x=549, y=210, w=186, h=54, right=735, bottom=264 --><rect data-node="budget" x="549" y="210" width="186" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="232.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="budget">线程栈也占进程内存</text><text x="642.0" y="250.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="budget">RSS 不等于已用堆</text><text x="390.0" y="325" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">Xmx 主要约束 Java 堆；容器预算还要为线程、本地内存及运行时开销留余量。</text>
</svg>