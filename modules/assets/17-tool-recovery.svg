<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 445" width="780" height="445" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">副作用结果不确定：UNKNOWN 不是 FAILED</title><desc id="diagram-desc">已授权且意图持久化后提交。明确成功可落为 SUCCEEDED；超时进入 UNKNOWN，按稳定业务键查流水。未查到不自动代表没有执行。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="445" fill="#ffffff"/>

<path data-connector="true" data-from="ready" data-to="sending" d="M 256,121.0 L 266,121.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="sending" data-to="success" d="M 508,121.0 L 518,121.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="intent" data-to="ready" d="M 138.0,180 L 138.0,168" fill="none" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/><path data-connector="true" data-from="sending" data-to="unknown" d="M 390.0,162 L 390.0,174" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" data-from="unknown" data-to="query" d="M 508,221.0 L 518,221.0" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="query" data-to="retry" d="M 642,262 C 642,268 138,268 138,274" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="query" data-to="wait" d="M 642,262 C 642,268 390,268 390,274" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/><path data-connector="true" data-from="query" data-to="restore" d="M 642,262 C 642,268 642,268 642,274" fill="none" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">副作用结果不确定：UNKNOWN 不是 FAILED</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">上排是正常提交；中排是超时恢复；下排是查询结果的三种处理规则</text><!-- ready: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="ready" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="ready">READY：已具备执行条件</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="ready">身份与具体参数已授权</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="ready">动作意图已持久化</text><!-- sending: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="sending" x="277" y="85" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="sending">SUBMITTING：已发送</text><text x="390.0" y="125.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="sending">稳定 intentId + 参数指纹</text><text x="390.0" y="143.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="sending">不是每次重试生成新键</text><!-- success: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="success" x="529" y="85" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="success">SUCCEEDED：确认成功</text><text x="642.0" y="125.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="success">收到可核验的业务凭证</text><text x="642.0" y="143.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="success">持久化业务 ID 与结果</text><!-- intent: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="intent" x="25" y="185" width="226" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="intent">持久化动作记录</text><text x="138.0" y="225.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="intent">intentId / payload / version</text><text x="138.0" y="243.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="intent">崩溃后重读，防并发推进</text><!-- unknown: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="unknown" x="277" y="185" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="unknown">UNKNOWN：响应超时/丢失</text><text x="390.0" y="225.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="unknown">可能未执行，也可能已成功</text><text x="390.0" y="243.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="unknown">保留原意图；不直接重做</text><!-- query: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="query" x="529" y="185" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="query">按业务键查询 / 对账</text><text x="642.0" y="225.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="query">重新检查身份与授权</text><text x="642.0" y="243.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="query">结合服务端幂等记录判断</text><!-- retry: x=25, y=285, w=226, h=72, right=251, bottom=357 --><rect data-node="retry" x="25" y="285" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="307.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retry">权威确认未执行</text><text x="138.0" y="325.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retry">满足幂等/重试契约后</text><text x="138.0" y="343.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retry">以原意图、原键受控重试</text><!-- wait: x=277, y=285, w=226, h=72, right=503, bottom=357 --><rect data-node="wait" x="277" y="285" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="390.0" y="307.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="wait">仍无法确认结果</text><text x="390.0" y="325.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="wait">保持 UNKNOWN 并退避</text><text x="390.0" y="343.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="wait">预算耗尽后转人工处理</text><!-- restore: x=529, y=285, w=226, h=72, right=755, bottom=357 --><rect data-node="restore" x="529" y="285" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="307.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restore">确认动作已经完成</text><text x="642.0" y="325.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restore">补记结果为 SUCCEEDED</text><text x="642.0" y="343.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="restore">不得再次触发相同副作用</text><text x="390.0" y="388" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">下排列出互斥处理条件，不表示无条件自动重试；明确拒绝可落 FAILED，不能把所有超时归失败。</text><text x="390.0" y="404" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">“暂时未查到”可能来自异步受理或最终一致查询；必须按服务契约判断，不能据此重做。</text><text x="390.0" y="420" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">Checkpoint 只恢复运行过程；外部效果仍需要业务服务的幂等、流水与对账机制。</text>
</svg>