<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 321" width="780" height="321" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">G1 周期：并发标记与暂停疏散承担不同任务</title><desc id="diagram-desc">示意一次 G1 周期的年轻代收集、并发启动、并发标记、Remark、Cleanup 以及 Mixed 回收；STW 阶段明确标记。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="321" fill="#ffffff"/>

<path data-connector="true" d="M 256,116.0 L 266,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 508,116.0 L 518,116.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.0,157 L 642.0,169" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 524,216.0 L 514,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 272,216.0 L 262,216.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">G1 周期：并发标记与暂停疏散承担不同任务</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">按 ①→⑥ 阅读，第二行从右向左；STW 表示应用线程暂停</text><!-- young: x=25, y=80, w=226, h=72, right=251, bottom=152 --><rect data-node="young" x="25" y="80" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="102.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="young">① Young-only</text><text x="138.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="young">常规年轻代收集（STW）</text><text x="138.0" y="138.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="young">达到触发条件后启动标记</text><!-- start: x=277, y=80, w=226, h=72, right=503, bottom=152 --><rect data-node="start" x="277" y="80" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="start">② Concurrent Start（STW）</text><text x="390.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="start">伴随年轻代收集</text><text x="390.0" y="138.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="start">建立并发标记的起点</text><!-- mark: x=529, y=80, w=226, h=72, right=755, bottom=152 --><rect data-node="mark" x="529" y="80" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.0" y="102.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="mark">③ Concurrent Mark</text><text x="642.0" y="120.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="mark">与应用并发追踪存活性</text><text x="642.0" y="138.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="mark">期间仍可发生 Young GC</text><!-- remark: x=529, y=180, w=226, h=72, right=755, bottom=252 --><rect data-node="remark" x="529" y="180" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="remark">④ Remark（STW）</text><text x="642.0" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="remark">完成标记、处理引用等</text><text x="642.0" y="238.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="remark">随后并发整理后续所需信息</text><!-- cleanup: x=277, y=180, w=226, h=72, right=503, bottom=252 --><rect data-node="cleanup" x="277" y="180" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cleanup">⑤ Cleanup（STW）</text><text x="390.0" y="220.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cleanup">完成候选集等准备</text><text x="390.0" y="238.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="cleanup">决定是否进入混合回收</text><!-- mixed: x=25, y=180, w=226, h=72, right=251, bottom=252 --><rect data-node="mixed" x="25" y="180" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="138.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="mixed">⑥ Prepare Mixed 之后</text><text x="138.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="mixed">多次 Mixed（STW）</text><text x="138.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="mixed">年轻代＋选中的老年代</text><text x="390.0" y="280" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">混合回收结束后回到 Young-only；不是每次标记都必然进入 Mixed。</text><text x="390.0" y="296" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">标记回答“谁还活着”；疏散把存活对象复制到其他 Region；暂停目标不是硬保证。</text>
</svg>