<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 405" width="780" height="405" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">GC 可达性：保留对象的是引用路径，不是业务意图</title><desc id="diagram-desc">GC Roots 经强引用保留缓存与对象 A；缓存强引用 WeakReference，但到对象 B 只有弱引用；独立的 U V 循环没有根路径。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="405" fill="#ffffff"/>

<path data-connector="true" d="M 256,116.0 L 266,116.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 508,116.0 L 518,116.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 390.0,157 L 390.0,169" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 508,216.0 L 518,216.0" fill="none" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/><path data-connector="true" d="M 256,307 L 266,307" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 272,325 L 262,325" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">GC 可达性：保留对象的是引用路径，不是业务意图</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">实线表示强引用；紫色虚线表示 WeakReference 的 referent 关系</text><!-- root: x=25, y=80, w=226, h=72, right=251, bottom=152 --><rect data-node="root" x="25" y="80" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="root">GC Roots（示意）</text><text x="138.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="root">活动栈引用、VM / JNI 根等</text><!-- cache: x=277, y=80, w=226, h=72, right=503, bottom=152 --><rect data-node="cache" x="277" y="80" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="111.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="cache">长期存活的缓存对象</text><text x="390.0" y="129.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="cache">由根强引用路径到达</text><!-- a: x=529, y=80, w=226, h=72, right=755, bottom=152 --><rect data-node="a" x="529" y="80" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="111.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="a">对象 A：业务早已结束</text><text x="642.0" y="129.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="a">缓存未删除 → 仍被保留</text><!-- weak-condition: x=25, y=180, w=226, h=72, right=251, bottom=252 --><rect data-node="weak-condition" x="25" y="180" width="226" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="138.0" y="202.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="weak-condition">判断 B 弱可达的前提</text><text x="138.0" y="220.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="weak-condition">没有强引用或软引用路径</text><text x="138.0" y="238.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="weak-condition">不能只看这一条虚线</text><!-- weak: x=277, y=180, w=226, h=72, right=503, bottom=252 --><rect data-node="weak" x="277" y="180" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="202.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="weak">WeakReference 包装对象</text><text x="390.0" y="220.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="weak">本身仍由缓存强引用</text><text x="390.0" y="238.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="weak">get() 可能返回 null</text><!-- b: x=529, y=180, w=226, h=72, right=755, bottom=252 --><rect data-node="b" x="529" y="180" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="b">对象 B：仅弱可达</text><text x="642.0" y="220.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="b">GC 发现弱可达后清除引用</text><text x="642.0" y="238.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="b">回收时点不由业务控制</text><!-- u: x=25, y=280, w=226, h=72, right=251, bottom=352 --><rect data-node="u" x="25" y="280" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="138.0" y="311.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="u">孤立对象 U</text><text x="138.0" y="329.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="u">强引用 V</text><!-- v: x=277, y=280, w=226, h=72, right=503, bottom=352 --><rect data-node="v" x="277" y="280" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="311.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="v">孤立对象 V</text><text x="390.0" y="329.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="v">强引用 U</text><!-- cycle-note: x=529, y=280, w=226, h=72, right=755, bottom=352 --><rect data-node="cycle-note" x="529" y="280" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="302.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cycle-note">没有任何根路径到 U / V</text><text x="642.0" y="320.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cycle-note">整体不可达</text><text x="642.0" y="338.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="cycle-note">互相引用不阻止回收</text><text x="390.0" y="380" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">可回收不等于立即回收；需分析所有根路径，并区分强、软、弱、虚引用语义。</text>
</svg>