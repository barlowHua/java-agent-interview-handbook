<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">检索命中、断言支持与业务成功：三个不同分母</title><desc id="diagram-desc">教学例子需要文档 A、B，实际召回 A、C、D。四个断言中三个有依据，但遗漏 B 的必要条件，业务仍然失败。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="410" fill="#ffffff"/>

<path data-connector="true" data-from="retrieval" data-to="retrieval-score" d="M 138.0,162 L 138.0,174" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="claims" data-to="claim-score" d="M 390.0,162 L 390.0,174" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" data-from="goal" data-to="task-score" d="M 642.0,162 L 642.0,174" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">检索命中、断言支持与业务成功：三个不同分母</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">同一任务可以检索命中、部分断言有依据，同时业务失败</text><!-- retrieval: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="retrieval" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retrieval">需要的证据：A、B</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retrieval">前 3 个结果：A、C、D</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="retrieval">唯一相关命中 A，排名 1</text><!-- claims: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="claims" x="277" y="85" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="claims">回答含 4 条可核验断言</text><text x="390.0" y="125.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="claims">其中 3 条由上下文支持</text><text x="390.0" y="143.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="claims">另 1 条没有证据支持</text><!-- goal: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="goal" x="529" y="85" width="226" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="goal">业务要求：满足全部条件</text><text x="642.0" y="125.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="goal">必须说明 B 中的例外</text><text x="642.0" y="143.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="goal">权限与副作用也要合格</text><!-- retrieval-score: x=25, y=185, w=226, h=72, right=251, bottom=257 --><rect data-node="retrieval-score" x="25" y="185" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="138.0" y="207.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="retrieval-score">Recall@3 = 1/2</text><text x="138.0" y="225.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="retrieval-score">Hit@3 = 1；RR@3 = 1</text><text x="138.0" y="243.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="retrieval-score">只回答“有没有找到证据”</text><!-- claim-score: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="claim-score" x="277" y="185" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="claim-score">Groundedness = 3/4</text><text x="390.0" y="225.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="claim-score">不保证资料真实或最新</text><text x="390.0" y="243.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="claim-score">也不证明被允许读取</text><!-- task-score: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="task-score" x="529" y="185" width="226" height="72" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="task-score">本任务：业务失败</text><text x="642.0" y="225.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="task-score">缺少 B 的必要限制条件</text><text x="642.0" y="243.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="task-score">不能用别的高分抵消</text><!-- denominators: x=25, y=285, w=730, h=72, right=755, bottom=357 --><rect data-node="denominators" x="25" y="285" width="730" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="390.0" y="307.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="denominators">检索按文档/块标注；生成按可核验断言；业务按任务与不变量判定</text><text x="390.0" y="325.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="denominators">无相关证据题单独统计拒答；无可核验断言记 N/A 并报告数量</text><text x="390.0" y="343.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="denominators">先约定权限、生效时间、标注粒度与宏/微平均，才能比较两个版本</text><text x="390.0" y="369" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">RR 是单题倒数排名；MRR 是多题 RR 的平均值。图中数字均为教学样例。</text><text x="390.0" y="385" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">评测不要把“给出空回答”自动算作满分；也不要把最终答案包含关键词视为业务完成。</text>
</svg>