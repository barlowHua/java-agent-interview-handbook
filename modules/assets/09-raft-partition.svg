<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 398" width="780" height="398" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Raft 网络分区：多数派可以推进，旧 leader 不能独自承诺</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="398" fill="#ffffff"/>
<rect data-group="minority" x="25" y="78" width="350" height="244" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="92" font-size="11" text-anchor="start" fill="#64748b">少数侧：2 / 5，无法组成多数</text><rect data-group="majority" x="405" y="78" width="350" height="244" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="415" y="92" font-size="11" text-anchor="start" fill="#64748b">多数侧：3 / 5，可按协议选举</text>
<path data-connector="true" d="M 200.0,167 L 200.0,176" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 570.0,167 L 570.0,176" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 720,135 C 745,135 745,162 745,212 C 745,252 745,284 726,284" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">Raft 网络分区：多数派可以推进，旧 leader 不能独自承诺</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">5 个节点分成 2 + 3；箭头代表新 leader 向两个 follower 复制日志</text><!-- oldleader: x=45, y=108, w=310, h=54, right=355, bottom=162 --><rect data-node="oldleader" x="45" y="108" width="310" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="200.0" y="130.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="oldleader">旧 leader：任期 7</text><text x="200.0" y="148.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="oldleader">仍活着 ≠ 仍可提交新写入</text><!-- oldfollower: x=45, y=187, w=310, h=54, right=355, bottom=241 --><rect data-node="oldfollower" x="45" y="187" width="310" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="200.0" y="209.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="oldfollower">follower A</text><text x="200.0" y="227.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="oldfollower">两份复制仍不足以提交</text><!-- noquorum: x=45, y=266, w=310, h=36, right=355, bottom=302 --><rect data-node="noquorum" x="45" y="266" width="310" height="36" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="200.0" y="288.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="noquorum">写请求等待或失败，不能编造成功</text><!-- newleader: x=425, y=108, w=290, h=54, right=715, bottom=162 --><rect data-node="newleader" x="425" y="108" width="290" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="570.0" y="130.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="newleader">新 leader：任期 8</text><text x="570.0" y="148.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="newleader">通过合法选举产生</text><!-- f1: x=425, y=187, w=290, h=54, right=715, bottom=241 --><rect data-node="f1" x="425" y="187" width="290" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="570.0" y="209.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="f1">follower B</text><text x="570.0" y="227.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="f1">匹配日志后确认复制</text><!-- f2: x=425, y=266, w=290, h=36, right=715, bottom=302 --><rect data-node="f2" x="425" y="266" width="290" height="36" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="570.0" y="288.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="f2">follower C：确认复制</text><text x="390.0" y="357" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">多数相交只是前提，还依赖任期、投票、日志匹配和当前任期提交规则；不是任意三份数据都安全。</text><text x="390.0" y="373" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">图假设崩溃故障与多数侧通信可用；线性一致读也须验证权限/提交进度，不能无条件读旧 leader。</text>
</svg>