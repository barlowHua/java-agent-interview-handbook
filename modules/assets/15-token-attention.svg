<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">从 token 到下一个 token：因果注意力做了什么</title><desc id="diagram-desc">编号经过嵌入和各层投影形成 Q、K、V。因果掩码挡住未来位置，权重加权 V，最终通过词表预测下一个 token。</desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="410" fill="#ffffff"/>
<rect data-group="causal-mask" x="25" y="185" width="226" height="172" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/><text x="35" y="199" font-size="11" text-anchor="start" fill="#64748b">因果可见性：行 i 只能看 j ≤ i</text>
<path data-connector="true" data-from="tokens" data-to="embedding" d="M 256,121.0 L 266,121.0" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" data-from="embedding" data-to="qkv" d="M 508,121.0 L 518,121.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" data-from="qkv" data-to="scores" d="M 642.0,162 L 642.0,174" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" data-from="scores" data-to="aggregate" d="M 524,221.0 L 514,221.0" fill="none" stroke="#a855f7" stroke-width="1.3" marker-end="url(#arrow-purple)"/><path data-connector="true" data-from="aggregate" data-to="output" d="M 390.0,262 L 390.0,274" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" data-from="output" data-to="append" d="M 508,321.0 L 518,321.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">从 token 到下一个 token：因果注意力做了什么</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">蓝色是输入，紫色是模型计算；矩阵仅表示可见性，不表示实际注意力分数</text><!-- tokens: x=25, y=85, w=226, h=72, right=251, bottom=157 --><rect data-node="tokens" x="25" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="138.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="tokens">文本 → tokenizer → 编号</text><text x="138.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="tokens">示意：t₁、t₂、t₃、t₄</text><text x="138.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="tokens">一个 token 不等于一个汉字</text><!-- embedding: x=277, y=85, w=226, h=72, right=503, bottom=157 --><rect data-node="embedding" x="277" y="85" width="226" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="390.0" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="embedding">token 嵌入与位置信息</text><text x="390.0" y="125.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="embedding">每个位置得到隐藏表示 X</text><text x="390.0" y="143.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="embedding">不是检索用的句向量</text><!-- qkv: x=529, y=85, w=226, h=72, right=755, bottom=157 --><rect data-node="qkv" x="529" y="85" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.0" y="107.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="qkv">各层的可学习线性投影</text><text x="642.0" y="125.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="qkv">Q = XWQ；K = XWK</text><text x="642.0" y="143.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="qkv">V = XWV</text><!-- scores: x=529, y=185, w=226, h=72, right=755, bottom=257 --><rect data-node="scores" x="529" y="185" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="642.0" y="207.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="scores">缩放得分 + 因果掩码</text><text x="642.0" y="225.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="scores">A = softmax(QKᵀ/√dₖ + M)</text><text x="642.0" y="243.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="scores">M 把未来位置设为负无穷</text><!-- aggregate: x=277, y=185, w=226, h=72, right=503, bottom=257 --><rect data-node="aggregate" x="277" y="185" width="226" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/><text x="390.0" y="207.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">按注意力权重汇总 A V</text><text x="390.0" y="225.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">多头合并、前馈与残差</text><text x="390.0" y="243.2" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="400" data-owner="aggregate">堆叠多层得到上下文表示</text><!-- output: x=277, y=285, w=226, h=72, right=503, bottom=357 --><rect data-node="output" x="277" y="285" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="307.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="output">最终隐藏表示 → 词表 logits</text><text x="390.0" y="325.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="output">转为概率并选择或采样</text><text x="390.0" y="343.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="output">得到下一个 token 编号</text><!-- append: x=529, y=285, w=226, h=72, right=755, bottom=357 --><rect data-node="append" x="529" y="285" width="226" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="642.0" y="307.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="append">未触发停止条件时</text><text x="642.0" y="325.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="append">把新 token 作为后续输入</text><text x="642.0" y="343.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="append">继续预测，直到结束</text><text x="145" y="216" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">列 j：已有位置</text><text x="130" y="237" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">1</text><text x="155" y="237" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">2</text><text x="180" y="237" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">3</text><text x="205" y="237" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">4</text><text x="86" y="258" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">行 1</text><rect data-cell="mask-0-0" x="119" y="244" width="22" height="22" rx="3" fill="#d1fae5"/><text x="130" y="258" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-0-1" x="144" y="244" width="22" height="22" rx="3" fill="#fce7f3"/><text x="155" y="258" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><rect data-cell="mask-0-2" x="169" y="244" width="22" height="22" rx="3" fill="#fce7f3"/><text x="180" y="258" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><rect data-cell="mask-0-3" x="194" y="244" width="22" height="22" rx="3" fill="#fce7f3"/><text x="205" y="258" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><text x="86" y="283" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">行 2</text><rect data-cell="mask-1-0" x="119" y="269" width="22" height="22" rx="3" fill="#d1fae5"/><text x="130" y="283" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-1-1" x="144" y="269" width="22" height="22" rx="3" fill="#d1fae5"/><text x="155" y="283" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-1-2" x="169" y="269" width="22" height="22" rx="3" fill="#fce7f3"/><text x="180" y="283" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><rect data-cell="mask-1-3" x="194" y="269" width="22" height="22" rx="3" fill="#fce7f3"/><text x="205" y="283" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><text x="86" y="308" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">行 3</text><rect data-cell="mask-2-0" x="119" y="294" width="22" height="22" rx="3" fill="#d1fae5"/><text x="130" y="308" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-2-1" x="144" y="294" width="22" height="22" rx="3" fill="#d1fae5"/><text x="155" y="308" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-2-2" x="169" y="294" width="22" height="22" rx="3" fill="#d1fae5"/><text x="180" y="308" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-2-3" x="194" y="294" width="22" height="22" rx="3" fill="#fce7f3"/><text x="205" y="308" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="400">×</text><text x="86" y="333" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">行 4</text><rect data-cell="mask-3-0" x="119" y="319" width="22" height="22" rx="3" fill="#d1fae5"/><text x="130" y="333" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-3-1" x="144" y="319" width="22" height="22" rx="3" fill="#d1fae5"/><text x="155" y="333" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-3-2" x="169" y="319" width="22" height="22" rx="3" fill="#d1fae5"/><text x="180" y="333" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><rect data-cell="mask-3-3" x="194" y="319" width="22" height="22" rx="3" fill="#d1fae5"/><text x="205" y="333" font-size="10" fill="#166534" text-anchor="middle" font-weight="400">可</text><text x="390.0" y="369" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">这里只画解码器自注意力的教学主干；省略归一化、具体位置编码与架构变体。</text><text x="390.0" y="385" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">注意力权重是信息混合系数，不是“事实正确率”；训练目标与业务验证是不同层。</text>
</svg>