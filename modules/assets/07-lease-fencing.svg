<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" width="780" height="418" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">租约过期后，随机 token 与 fencing 保护的是不同边界</title><desc id="diagram-desc"></desc>
<style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker><marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/></marker></defs>
<rect width="780" height="418" fill="#ffffff"/>

<path data-connector="true" d="M 255,105.0 L 266.5,105.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 507.5,105.0 L 519,105.0" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)"/><path data-connector="true" d="M 642.5,137 L 642.5,146" fill="none" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow-blue)"/><path data-connector="true" d="M 525,184.0 L 513.5,184.0" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/><path data-connector="true" d="M 137.5,137 L 137.5,146" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 255,184.0 L 266.5,184.0" fill="none" stroke="#ec4899" stroke-width="1.3" marker-end="url(#arrow-pink)"/><path data-connector="true" d="M 390.0,216 L 390.0,225" fill="none" stroke="#22c55e" stroke-width="1.3" marker-end="url(#arrow-green)"/>
<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">租约过期后，随机 token 与 fencing 保护的是不同边界</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">编号表示发生顺序；假设 fencing 由可靠的单调序号源签发，资源端原子校验</text><!-- a: x=25, y=78, w=225, h=54, right=250, bottom=132 --><rect data-node="a" x="25" y="78" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="137.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a">① A 获租约</text><text x="137.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="a">fence=41，随后暂停</text><!-- lease: x=277.5, y=78, w=225, h=54, right=502.5, bottom=132 --><rect data-node="lease" x="277.5" y="78" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="100.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="lease">② TTL 到期</text><text x="390.0" y="118.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="lease">锁记录已不再属于 A</text><!-- b: x=530, y=78, w=225, h=54, right=755, bottom=132 --><rect data-node="b" x="530" y="78" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="642.5" y="100.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="b">③ B 获新租约</text><text x="642.5" y="118.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="b">fence=42</text><!-- old: x=25, y=157, w=225, h=54, right=250, bottom=211 --><rect data-node="old" x="25" y="157" width="225" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="137.5" y="179.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="old">⑤ A 恢复并发出旧写</text><text x="137.5" y="197.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="old">仍携带 fence=41</text><!-- resource: x=277.5, y=157, w=225, h=54, right=502.5, bottom=211 --><rect data-node="resource" x="277.5" y="157" width="225" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="179.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="resource">④ 资源端接受 B 的写入</text><text x="390.0" y="197.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="resource">保存 maxFence=42</text><!-- bwrite: x=530, y=157, w=225, h=54, right=755, bottom=211 --><rect data-node="bwrite" x="530" y="157" width="225" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="642.5" y="179.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="bwrite">④ B 写资源</text><text x="642.5" y="197.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="bwrite">携带 fence=42</text><!-- unlock: x=25, y=236, w=225, h=54, right=250, bottom=290 --><rect data-node="unlock" x="25" y="236" width="225" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="137.5" y="258.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="unlock">比较随机 token 再 DEL</text><text x="137.5" y="276.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="unlock">只能避免误删 B 的锁</text><!-- reject: x=277.5, y=236, w=225, h=54, right=502.5, bottom=290 --><rect data-node="reject" x="277.5" y="236" width="225" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="390.0" y="258.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="reject">⑥ 41 &lt; maxFence 42</text><text x="390.0" y="276.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="reject">资源拒绝 A 的迟到写入</text><!-- limit: x=530, y=236, w=225, h=54, right=755, bottom=290 --><rect data-node="limit" x="530" y="236" width="225" height="54" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/><text x="642.5" y="258.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="limit">资源若不检查 fence</text><text x="642.5" y="276.2" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="400" data-owner="limit">锁服务无法阻止旧写</text><!-- boundary: x=25, y=315, w=730, h=54, right=755, bottom=369 --><rect data-node="boundary" x="25" y="315" width="730" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="390.0" y="337.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="boundary">随机 token 回答“谁能解锁”；fencing 回答“资源是否接受这次写入”。</text><text x="390.0" y="355.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" data-owner="boundary">fencing 防旧持有者，不会自动去重同一持有者的重复业务请求；仍需业务幂等。</text><text x="390.0" y="393" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">旧持有者的写入和资源的版本比较必须在同一原子边界；仅在客户端比较序号仍有竞态。</text>
</svg>