<text x="390.0" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="600">知识路线：基础机制支撑工程判断</text><text x="390.0" y="55" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">章节编号对应正文；横向是依赖顺序，纵向是不同能力线</text><!-- n00: x=24, y=80, w=224, h=54, right=248, bottom=134 --><rect data-node="n00" x="24" y="80" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="102.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n00">01–02 语言与集合</text><text x="136.0" y="120.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n00">契约 / 数据结构</text><!-- n01: x=278, y=80, w=224, h=54, right=502, bottom=134 --><rect data-node="n01" x="278" y="80" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="102.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n01">03–05 并发与运行时</text><text x="390.0" y="120.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n01">线程 / JVM / Spring</text><!-- n02: x=532, y=80, w=224, h=54, right=756, bottom=134 --><rect data-node="n02" x="532" y="80" width="224" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="102.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n02">验证：并发实验</text><text x="644.0" y="120.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n02">讲清发布与事务边界</text><!-- n10: x=24, y=162, w=224, h=54, right=248, bottom=216 --><rect data-node="n10" x="24" y="162" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="184.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n10">06–08 数据与消息</text><text x="136.0" y="202.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n10">索引 / 缓存 / 投递</text><!-- n11: x=278, y=162, w=224, h=54, right=502, bottom=216 --><rect data-node="n11" x="278" y="162" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="184.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n11">09–12 分布式与系统</text><text x="390.0" y="202.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n11">一致性 / 容量 / SLO</text><!-- n12: x=532, y=162, w=224, h=54, right=756, bottom=216 --><rect data-node="n12" x="532" y="162" width="224" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="184.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n12">验证：故障注入</text><text x="644.0" y="202.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n12">预测崩溃与恢复结果</text><!-- n20: x=24, y=244, w=224, h=54, right=248, bottom=298 --><rect data-node="n20" x="24" y="244" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="266.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n20">15 LLM 基础</text><text x="136.0" y="284.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n20">上下文 / 推理 / 输出</text><!-- n21: x=278, y=244, w=224, h=54, right=502, bottom=298 --><rect data-node="n21" x="278" y="244" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="266.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n21">16–18 Agent 工程</text><text x="390.0" y="284.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n21">检索 / 工具 / 评测</text><!-- n22: x=532, y=244, w=224, h=54, right=756, bottom=298 --><rect data-node="n22" x="532" y="244" width="224" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="266.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n22">验证：任务闭环</text><text x="644.0" y="284.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n22">权限 / 成本 / 恢复</text><!-- n30: x=24, y=326, w=224, h=54, right=248, bottom=380 --><rect data-node="n30" x="24" y="326" width="224" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/><text x="136.0" y="348.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n30">13 安全 + 14 编码</text><text x="136.0" y="366.2" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="400" data-owner="n30">边界 / 正确性 / 测试</text><!-- n31: x=278, y=326, w=224, h=54, right=502, bottom=380 --><rect data-node="n31" x="278" y="326" width="224" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="390.0" y="348.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n31">19 项目与技术判断</text><text x="390.0" y="366.2" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400" data-owner="n31">事实 / 取舍 / 证据</text><!-- n32: x=532, y=326, w=224, h=54, right=756, bottom=380 --><rect data-node="n32" x="532" y="326" width="224" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.2"/><text x="644.0" y="348.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n32">最终：四场模拟</text><text x="644.0" y="366.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="400" data-owner="n32">闭卷回答与变式追问</text><text x="390.0" y="437" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">每次学习：看图讲路径 → 合上图重画 → 改一个约束 → 用练习验证。</text>
</svg>