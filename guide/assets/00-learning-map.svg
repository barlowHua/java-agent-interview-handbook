<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 462" width="780" height="462" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">知识路线：基础机制支撑工程判断</title><desc id="diagram-desc">四条学习路线及其验证产物，最后汇合到项目与模拟面试。</desc>
